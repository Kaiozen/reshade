name: Build ZZZ DXIL Assembler Pruner v23

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prune:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Restore exact ZZZ parent DXIL and helper source
        shell: pwsh
        run: |
          $inputB64 = @'

'@

          $cppB64 = @'

'@

          [IO.File]::WriteAllBytes(
            "$PWD\zzz-parent-dxil-v20.bin",
            [Convert]::FromBase64String($inputB64.Trim())
          )

          [IO.File]::WriteAllBytes(
            "$PWD\dxil_surgeon.cpp",
            [Convert]::FromBase64String($cppB64.Trim())
          )

          $inputHash = (
            Get-FileHash
              "$PWD\zzz-parent-dxil-v20.bin"
              -Algorithm SHA256
          ).Hash.ToLowerInvariant()

          if ($inputHash -ne "02d3db46e867f0b38da35a492101ae35544f5f93425fb4fb29120aeeea431869") {
            throw "Input SHA256 mismatch: $inputHash"
          }

          if (
            (Get-Item "$PWD\zzz-parent-dxil-v20.bin").Length
            -ne 26964
          ) {
            throw "Input size mismatch"
          }

          Write-Host "INPUT_SHA256=$inputHash"
          Write-Host "INPUT_SIZE=26964"

      - name: Download official Microsoft DXC v1.9.2607
        shell: pwsh
        run: |
          $url = "https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2607/dxc_2026_07_29.zip"

          Invoke-WebRequest
            -Uri $url
            -OutFile "$PWD\dxc.zip"

          $zipHash = (
            Get-FileHash
              "$PWD\dxc.zip"
              -Algorithm SHA256
          ).Hash.ToLowerInvariant()

          if (
            $zipHash
            -ne
            "a1dfb116ba3eeae6a1582291b53a8e7bf65ad760676bd3194685c8f7367cd241"
          ) {
            throw "DXC archive SHA256 mismatch: $zipHash"
          }

          Expand-Archive
            "$PWD\dxc.zip"
            "$PWD\dxc"

          $dxcExe = Get-ChildItem
            "$PWD\dxc"
            -Recurse
            -Filter dxc.exe |
            Where-Object {
              $_.FullName -match '\\bin\\x64\\dxc\.exe$'
            } |
            Select-Object -First 1

          if (-not $dxcExe) {
            throw "dxc.exe not found"
          }

          $x64Dir = $dxcExe.DirectoryName
          $binDir = Split-Path $x64Dir -Parent
          $root = Split-Path $binDir -Parent

          $dxvExe = Join-Path $x64Dir "dxv.exe"

          "DXC_ROOT=$root" |
            Out-File
              -FilePath $env:GITHUB_ENV
              -Append

          "DXC_EXE=$($dxcExe.FullName)" |
            Out-File
              -FilePath $env:GITHUB_ENV
              -Append

          "DXV_EXE=$dxvExe" |
            Out-File
              -FilePath $env:GITHUB_ENV
              -Append

          "DXC_X64_DIR=$x64Dir" |
            Out-File
              -FilePath $env:GITHUB_ENV
              -Append

          Write-Host "DXC_ROOT=$root"
          Write-Host "DXC_EXE=$($dxcExe.FullName)"
          Write-Host "DXV_EXE=$dxvExe"

      - name: Build DXIL assembler surgeon
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /EHsc /W4 /DUNICODE /D_UNICODE /I"%DXC_ROOT%\inc" dxil_surgeon.cpp /Fe:dxil_surgeon.exe /link /LIBPATH:"%DXC_ROOT%\lib\x64" dxcompiler.lib ole32.lib

      - name: Run physical DXIL surgery
        shell: pwsh
        continue-on-error: true
        run: |
          Copy-Item
            "$env:DXC_X64_DIR\dxcompiler.dll"
            "$PWD\dxcompiler.dll"

          if (
            Test-Path
              "$env:DXC_X64_DIR\dxil.dll"
          ) {
            Copy-Item
              "$env:DXC_X64_DIR\dxil.dll"
              "$PWD\dxil.dll"
          }

          & "$PWD\dxil_surgeon.exe" `
            "$PWD\zzz-parent-dxil-v20.bin" `
            "$PWD\original.ll" `
            "$PWD\modified-no-sort.ll" `
            "$PWD\execute-plus-miss-pruned.dxil" `
            2>&1 |
            Tee-Object
              "$PWD\surgeon.log"

          $code = $LASTEXITCODE

          "SURGEON_EXIT=$code" |
            Set-Content
              "$PWD\surgeon-status.txt"

          Write-Host "SURGEON_EXIT=$code"

      - name: Validate regenerated container
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item
            -ItemType Directory
            -Force
            "$PWD\report" |
            Out-Null

          $pass = $true

          if (
            -not (
              Test-Path
                "$PWD\execute-plus-miss-pruned.dxil"
            )
          ) {
            "ERROR: Pruned DXIL was not produced." |
              Tee-Object
                "$PWD\report\validation.txt"

            $pass = $false
          }
          else {
            & "$env:DXC_EXE" `
              -dumpbin `
              "$PWD\execute-plus-miss-pruned.dxil" `
              1> "$PWD\report\pruned-dump.txt" `
              2> "$PWD\report\pruned-dump-errors.txt"

            $dumpCode = $LASTEXITCODE

            if (
              Test-Path
                "$env:DXV_EXE"
            ) {
              & "$env:DXV_EXE" `
                "$PWD\execute-plus-miss-pruned.dxil" `
                1> "$PWD\report\dxv.txt" `
                2>&1

              $dxvCode = $LASTEXITCODE
            }
            else {
              $dxvCode = 127

              "dxv.exe missing" |
                Set-Content
                  "$PWD\report\dxv.txt"
            }

            $dump = Get-Content
              "$PWD\report\pruned-dump.txt"
              -Raw

            $sortCount = (
              Select-String
                -Path "$PWD\report\pruned-dump.txt"
                -Pattern "ExecuteTrace_SortRay"
                -SimpleMatch
            ).Count

            $executeCount = (
              Select-String
                -Path "$PWD\report\pruned-dump.txt"
                -Pattern "ExecuteTrace"
                -SimpleMatch
            ).Count

            $missCount = (
              Select-String
                -Path "$PWD\report\pruned-dump.txt"
                -Pattern "Miss"
                -SimpleMatch
            ).Count

            $outputHash = (
              Get-FileHash
                "$PWD\execute-plus-miss-pruned.dxil"
                -Algorithm SHA256
            ).Hash.ToLowerInvariant()

            $outputSize = (
              Get-Item
                "$PWD\execute-plus-miss-pruned.dxil"
            ).Length

            @(
              "DUMP_EXIT=$dumpCode"
              "DXV_EXIT=$dxvCode"
              "OUTPUT_SIZE=$outputSize"
              "OUTPUT_SHA256=$outputHash"
              "EXECUTETRACE_OCCURRENCES=$executeCount"
              "MISS_OCCURRENCES=$missCount"
              "SORTRAY_OCCURRENCES=$sortCount"
            ) |
              Set-Content
                "$PWD\report\validation.txt"

            if ($dumpCode -ne 0) {
              $pass = $false
            }

            if ($dxvCode -ne 0) {
              $pass = $false
            }

            if ($sortCount -ne 0) {
              $pass = $false
            }

            if ($executeCount -lt 1) {
              $pass = $false
            }

            if ($missCount -lt 1) {
              $pass = $false
            }
          }

          Copy-Item
            "$PWD\surgeon.log"
            "$PWD\report\"
            -ErrorAction SilentlyContinue

          Copy-Item
            "$PWD\surgeon-status.txt"
            "$PWD\report\"
            -ErrorAction SilentlyContinue

          Copy-Item
            "$PWD\original.ll"
            "$PWD\report\"
            -ErrorAction SilentlyContinue

          Copy-Item
            "$PWD\modified-no-sort.ll"
            "$PWD\report\"
            -ErrorAction SilentlyContinue

          Copy-Item
            "$PWD\execute-plus-miss-pruned.dxil"
            "$PWD\report\"
            -ErrorAction SilentlyContinue

          Copy-Item
            "$PWD\zzz-parent-dxil-v20.bin"
            "$PWD\report\"
            -ErrorAction SilentlyContinue

          if ($pass) {
            "PASS" |
              Set-Content
                "$PWD\report\RESULT.txt"

            Write-Host "V23_ASSEMBLER_PRUNER_PASS"
          }
          else {
            "FAIL" |
              Set-Content
                "$PWD\report\RESULT.txt"

            Write-Host "V23_ASSEMBLER_PRUNER_FAIL"
          }

      - name: Upload complete V23 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zzz-dxil-assembler-pruner-v23
          path: report
          if-no-files-found: error

      - name: Final result gate
        shell: pwsh
        run: |
          Get-Content
            "$PWD\report\validation.txt"
            -ErrorAction SilentlyContinue

          Get-Content
            "$PWD\report\RESULT.txt"

          if (
            (Get-Content "$PWD\report\RESULT.txt")
            -ne
            "PASS"
          ) {
            throw "V23 assembler surgery did not produce a validated container."
          }

          Write-Host "V23_PHYSICALLY_PRUNED_DXIL_READY"
