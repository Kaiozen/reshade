name: Symbolicate ReShade D3DMetal Native Runtime Bridge v2 crash v3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout ReShade and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          ref: 5e1c5d120c5e349578ac7abf633dc745274e23c6

      - name: Force-update submodules
        shell: pwsh
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force
          if (-not (Test-Path "deps\stb\stb_image.h")) {
            throw "ERROR: stb_image.h is missing."
          }
          if (-not (Test-Path "deps\glad\glad\__init__.py")) {
            throw "ERROR: GLAD Python files are missing."
          }
          Write-Host "Submodules are complete."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Show build environment
        shell: pwsh
        run: |
          python --version
          msbuild -version
          git rev-parse HEAD
          git submodule status --recursive

      - name: Patch native D3D12 runtime bridge
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          
          ROOT = Path('.')
          
          def read(rel):
              return (ROOT / rel).read_text(encoding='utf-8-sig')
          
          def write(rel, text):
              (ROOT / rel).write_text(text, encoding='utf-8', newline='\n')
          
          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected 1 occurrence, found {count}')
              return text.replace(old, new, 1)
          
          # 1) Native device early return
          rel = 'source/d3d12/d3d12.cpp'
          s = read(rel)
          anchor = "\t// The returned device should alway implement the 'ID3D12Device' base interface"
          insert = (
              "#if RESHADE_ADDON >= 2\n"
              "\t// Balance the temporary add-on-manager reference without constructing a COM proxy.\n"
              "\treshade::unload_addons();\n"
              "#endif\n"
              "\treshade::log::message(\n"
              "\t\treshade::log::level::info,\n"
              "\t\t\"D3DMetal native runtime bridge: returning the original ID3D12Device before all ReShade D3D12Device proxy logic.\");\n"
              "\treturn hr;\n\n" + anchor
          )
          s = replace_once(s, anchor, insert, 'd3d12 early return')
          write(rel, s)
          
          # 2) Private command queue implementation can disable unsupported GPU timestamp queries
          rel = 'source/d3d12/d3d12_impl_command_queue.hpp'
          s = read(rel)
          s = replace_once(
              s,
              'command_queue_impl(device_impl *device, ID3D12CommandQueue *queue);',
              'command_queue_impl(device_impl *device, ID3D12CommandQueue *queue, bool disable_timestamp_queries = false);',
              'queue constructor declaration')
          s = replace_once(
              s,
              '\t\tcom_ptr<ID3D12Fence> _wait_idle_fence;\n',
              '\t\tcom_ptr<ID3D12Fence> _wait_idle_fence;\n\n\t\tconst bool _disable_timestamp_queries;\n',
              'queue timestamp member')
          write(rel, s)
          
          rel = 'source/d3d12/d3d12_impl_command_queue.cpp'
          s = read(rel)
          s = replace_once(
              s,
              'reshade::d3d12::command_queue_impl::command_queue_impl(device_impl *device, ID3D12CommandQueue *queue) :\n\tapi_object_impl(queue),\n\t_device(device)',
              'reshade::d3d12::command_queue_impl::command_queue_impl(device_impl *device, ID3D12CommandQueue *queue, bool disable_timestamp_queries) :\n\tapi_object_impl(queue),\n\t_device(device),\n\t_disable_timestamp_queries(disable_timestamp_queries)',
              'queue constructor definition')
          s = replace_once(
              s,
              '{\n\t// Register queue to device',
              '{\n\tif (_disable_timestamp_queries)\n\t\tlog::message(log::level::info, "D3DMetal native runtime bridge: GPU timestamp queries disabled for the private ReShade command queue.");\n\n\t// Register queue to device',
              'queue marker')
          s = replace_once(
              s,
              'uint64_t reshade::d3d12::command_queue_impl::get_timestamp_frequency() const\n{\n\tUINT64 frequency;',
              'uint64_t reshade::d3d12::command_queue_impl::get_timestamp_frequency() const\n{\n\tif (_disable_timestamp_queries)\n\t\treturn 0;\n\n\tUINT64 frequency;',
              'queue timestamp bypass')
          write(rel, s)
          
          # 3) Avoid allocating timestamp query heaps when frequency is disabled
          rel = 'source/runtime.cpp'
          s = read(rel)
          s = replace_once(
              s,
              '\tif (permutation_index == 0 &&\n\t\t!_device->create_query_heap(api::query_type::timestamp,',
              '\tif (permutation_index == 0 && _timestamp_frequency != 0 &&\n\t\t!_device->create_query_heap(api::query_type::timestamp,',
              'runtime query heap guard')
          write(rel, s)
          
          # 4) Add a DXGI swap-chain constructor backed by private non-COM D3D12 implementation objects
          rel = 'source/dxgi/dxgi_swapchain.hpp'
          s = read(rel)
          s = replace_once(
              s,
              'class D3D12CommandQueue;\nnamespace reshade::api { enum class device_api; struct swapchain; }',
              'class D3D12CommandQueue;\nstruct ID3D12Device;\nstruct ID3D12CommandQueue;\nnamespace reshade::api { enum class device_api; struct swapchain; }\nnamespace reshade::d3d12 { class device_impl; class command_queue_impl; }',
              'header forward declarations')
          s = replace_once(
              s,
              '\tDXGISwapChain(IDXGIFactory *factory, D3D12CommandQueue *command_queue, IDXGISwapChain3 *original);\n',
              '\tDXGISwapChain(IDXGIFactory *factory, D3D12CommandQueue *command_queue, IDXGISwapChain3 *original);\n\tDXGISwapChain(IDXGIFactory *factory, ID3D12Device *device, ID3D12CommandQueue *command_queue, IDXGISwapChain3 *original);\n',
              'native bridge constructor declaration')
          s = replace_once(
              s,
              '\tconst reshade::api::device_api _direct3d_version;\n\n\tIDXGIFactory *const _parent_factory;',
              '\tconst reshade::api::device_api _direct3d_version;\n\n\t// Private implementation objects used only by ReShade. These are never returned through COM.\n\treshade::d3d12::device_impl *const _owned_d3d12_device_impl;\n\treshade::d3d12::command_queue_impl *const _owned_d3d12_command_queue_impl;\n\treshade::d3d12::command_queue_impl *const _direct3d_command_queue_impl;\n\n\tIDXGIFactory *const _parent_factory;',
              'bridge members')
          write(rel, s)
          
          rel = 'source/dxgi/dxgi_swapchain.cpp'
          s = read(rel)
          # Add member initializers to D3D10, D3D11, D3D12 constructors
          s = replace_once(
              s,
              '\t_direct3d_version(reshade::api::device_api::d3d10),\n\t_parent_factory(factory),',
              '\t_direct3d_version(reshade::api::device_api::d3d10),\n\t_owned_d3d12_device_impl(nullptr),\n\t_owned_d3d12_command_queue_impl(nullptr),\n\t_direct3d_command_queue_impl(nullptr),\n\t_parent_factory(factory),',
              'd3d10 member initializers')
          s = replace_once(
              s,
              '\t_direct3d_version(reshade::api::device_api::d3d11),\n\t_parent_factory(factory),',
              '\t_direct3d_version(reshade::api::device_api::d3d11),\n\t_owned_d3d12_device_impl(nullptr),\n\t_owned_d3d12_command_queue_impl(nullptr),\n\t_direct3d_command_queue_impl(nullptr),\n\t_parent_factory(factory),',
              'd3d11 member initializers')
          s = replace_once(
              s,
              '\t_direct3d_version(reshade::api::device_api::d3d12),\n\t_parent_factory(factory),\n\t_impl(new reshade::d3d12::swapchain_impl(command_queue->_device, original))',
              '\t_direct3d_version(reshade::api::device_api::d3d12),\n\t_owned_d3d12_device_impl(nullptr),\n\t_owned_d3d12_command_queue_impl(nullptr),\n\t_direct3d_command_queue_impl(command_queue),\n\t_parent_factory(factory),\n\t_impl(new reshade::d3d12::swapchain_impl(command_queue->_device, original))',
              'proxy d3d12 member initializers')
          s = replace_once(
              s,
              '\treshade::create_effect_runtime(_impl, command_queue);\n\ton_init(false);\n}\nDXGISwapChain::~DXGISwapChain()',
              '\treshade::create_effect_runtime(_impl, _direct3d_command_queue_impl);\n\ton_init(false);\n}\nDXGISwapChain::DXGISwapChain(IDXGIFactory *factory, ID3D12Device *device, ID3D12CommandQueue *command_queue, IDXGISwapChain3 *original) :\n\t_orig(original),\n\t_interface_version(3),\n\t_direct3d_device(device),\n\t_direct3d_command_queue(command_queue),\n\t_direct3d_version(reshade::api::device_api::d3d12),\n\t_owned_d3d12_device_impl(new reshade::d3d12::device_impl(device)),\n\t_owned_d3d12_command_queue_impl(new reshade::d3d12::command_queue_impl(_owned_d3d12_device_impl, command_queue, true)),\n\t_direct3d_command_queue_impl(_owned_d3d12_command_queue_impl),\n\t_parent_factory(factory),\n\t_impl(new reshade::d3d12::swapchain_impl(_owned_d3d12_device_impl, original))\n{\n\tassert(_orig != nullptr && _direct3d_device != nullptr && _direct3d_command_queue != nullptr && _direct3d_command_queue_impl != nullptr && _parent_factory != nullptr);\n\t_parent_factory->AddRef();\n\t_direct3d_device->AddRef();\n\t_direct3d_command_queue->AddRef();\n\n\tfor (size_t i = 0; i < std::size(_direct3d_command_queue_per_back_buffer); ++i)\n\t\t_direct3d_command_queue_per_back_buffer[i] = _direct3d_command_queue;\n\n\tDXGISwapChain *const swapchain_proxy = this;\n\t_orig->SetPrivateData(__uuidof(DXGISwapChain), sizeof(swapchain_proxy), &swapchain_proxy);\n\n\treshade::log::message(reshade::log::level::info, "D3DMetal native runtime bridge: ReShade runtime is hosted by private non-COM D3D12 implementation objects.");\n\treshade::create_effect_runtime(_impl, _direct3d_command_queue_impl);\n\ton_init(false);\n}\nDXGISwapChain::~DXGISwapChain()',
              'native bridge constructor definition')
          s = replace_once(
              s,
              '\tcase reshade::api::device_api::d3d12:\n\t\tdelete static_cast<reshade::d3d12::swapchain_impl *>(_impl);\n\t\tbreak;\n\t}\n\n\t// Release the explicit reference',
              '\tcase reshade::api::device_api::d3d12:\n\t\tdelete static_cast<reshade::d3d12::swapchain_impl *>(_impl);\n\t\tbreak;\n\t}\n\n\t// The queue implementation unregisters itself from the device implementation, so destroy in this order.\n\tdelete _owned_d3d12_command_queue_impl;\n\tdelete _owned_d3d12_device_impl;\n\n\t// Release the explicit reference',
              'bridge destruction')
          # Replace all assumptions that the queue implementation is also a COM proxy
          s = s.replace('static_cast<D3D12CommandQueue *>(_direct3d_command_queue)->_mutex', '_direct3d_command_queue_impl->_mutex')
          s = s.replace('static_cast<D3D12CommandQueue *>(_direct3d_command_queue)->flush_immediate_command_list();', '_direct3d_command_queue_impl->flush_immediate_command_list();')
          s = s.replace('static_cast<D3D12CommandQueue *>(_direct3d_command_queue),\n\t\t\t_impl,', '_direct3d_command_queue_impl,\n\t\t\t_impl,')
          s = s.replace('static_cast<D3D12CommandQueue *>(_direct3d_command_queue), _impl);', '_direct3d_command_queue_impl, _impl);')
          if 'static_cast<D3D12CommandQueue *>(_direct3d_command_queue)' in s:
              raise RuntimeError('unconverted D3D12 command queue proxy cast remains')
          write(rel, s)
          
          # 5) When a native D3D12 queue creates a swap chain, build the private runtime bridge
          rel = 'source/dxgi/dxgi.cpp'
          s = read(rel)
          signature_old = "static void init_swapchain_proxy(IDXGIFactory *factory, reshade::api::device_api direct3d_version, const com_ptr<IUnknown> &device_proxy, T *&swapchain, DXGI_USAGE usage, [[maybe_unused]] UINT sync_interval, [[maybe_unused]] DXGI_SWAP_CHAIN_DESC orig_desc, [[maybe_unused]] bool desc_modified)"
          signature_new = "static void init_swapchain_proxy(IDXGIFactory *factory, reshade::api::device_api direct3d_version, const com_ptr<IUnknown> &device_proxy, IUnknown *native_device_object, T *&swapchain, DXGI_USAGE usage, [[maybe_unused]] UINT sync_interval, [[maybe_unused]] DXGI_SWAP_CHAIN_DESC orig_desc, [[maybe_unused]] bool desc_modified)"
          s = replace_once(s, signature_old, signature_new, 'native bridge init signature')
          call_old = 'init_swapchain_proxy(pFactory, direct3d_version, device_proxy, *ppSwapChain'
          call_new = 'init_swapchain_proxy(pFactory, direct3d_version, device_proxy, pDevice, *ppSwapChain'
          call_count = s.count(call_old)
          if call_count != 4:
              raise RuntimeError(f'native bridge init calls: expected 4 occurrences, found {call_count}')
          s = s.replace(call_old, call_new)
          old = '''\telse\n\t{\n\t\treshade::log::message(reshade::log::level::warning, "Skipping swap chain because it was created without a proxy Direct3D device.");\n\t}\n'''
          new = '''\telse if (com_ptr<ID3D12CommandQueue> native_command_queue;\n\t\tnative_device_object != nullptr && SUCCEEDED(native_device_object->QueryInterface(&native_command_queue)))\n\t{\n\t\tcom_ptr<ID3D12Device> native_device;\n\t\tcom_ptr<IDXGISwapChain3> swapchain3;\n\t\tif (SUCCEEDED(native_command_queue->GetDevice(IID_PPV_ARGS(&native_device))) &&\n\t\t\tSUCCEEDED(swapchain->QueryInterface(&swapchain3)))\n\t\t{\n\t\t\treshade::log::message(reshade::log::level::info, "D3DMetal native runtime bridge: captured native ID3D12Device and ID3D12CommandQueue at DXGI swap-chain creation.");\n\t\t\tswapchain_proxy = new DXGISwapChain(factory, native_device.get(), native_command_queue.get(), swapchain3.get());\n\t\t}\n\t\telse\n\t\t{\n\t\t\treshade::log::message(reshade::log::level::warning, "D3DMetal native runtime bridge: native D3D12 objects were found, but the bridge could not initialize.");\n\t\t}\n\t}\n\telse\n\t{\n\t\treshade::log::message(reshade::log::level::warning, "Skipping swap chain because it was created without a proxy Direct3D device.");\n\t}\n'''
          s = replace_once(s, old, new, 'native bridge init path')
          write(rel, s)
          
          # Verification
          checks = {
              'source/d3d12/d3d12.cpp': [
                  'D3DMetal native runtime bridge: returning the original ID3D12Device',
                  'return hr;',
                  'new D3D12Device',
              ],
              'source/dxgi/dxgi.cpp': [
                  'IUnknown *native_device_object',
                  'native_device_object != nullptr && SUCCEEDED(native_device_object->QueryInterface(&native_command_queue))',
                  'captured native ID3D12Device and ID3D12CommandQueue',
                  'new DXGISwapChain(factory, native_device.get(), native_command_queue.get(), swapchain3.get())',
              ],
              'source/dxgi/dxgi_swapchain.cpp': [
                  'private non-COM D3D12 implementation objects',
                  'new reshade::d3d12::device_impl(device)',
                  'new reshade::d3d12::command_queue_impl(_owned_d3d12_device_impl, command_queue, true)',
                  'reshade::create_effect_runtime(_impl, _direct3d_command_queue_impl);',
                  '_direct3d_command_queue_impl->flush_immediate_command_list();',
              ],
              'source/d3d12/d3d12_impl_command_queue.cpp': [
                  'GPU timestamp queries disabled',
                  'if (_disable_timestamp_queries)',
              ],
          }
          for rel, strings in checks.items():
              text = read(rel)
              for item in strings:
                  if item not in text:
                      raise RuntimeError(f'missing verification marker in {rel}: {item}')
          
          entry = read('source/d3d12/d3d12.cpp')
          if not (entry.find('returning the original ID3D12Device') < entry.find('return hr;', entry.find('returning the original ID3D12Device')) < entry.find('new D3D12Device')):
              raise RuntimeError('native device early return ordering failed')
          
          dxgi = read('source/dxgi/dxgi.cpp')
          if dxgi.count('init_swapchain_proxy(pFactory, direct3d_version, device_proxy, pDevice, *ppSwapChain') != 4:
              raise RuntimeError('native device object was not forwarded to all swap-chain initialization paths')
          if 'SUCCEEDED(device->QueryInterface(&native_command_queue))' in dxgi:
              raise RuntimeError('stale undeclared device identifier remains in native bridge path')

          print('PATCH_OK')
          '@ | Set-Content `
            -Path patch_native_runtime_bridge.py `
            -Encoding utf8
          python patch_native_runtime_bridge.py

      - name: Verify bridge source
        shell: pwsh
        run: |
          Write-Host "===== NATIVE DEVICE EARLY RETURN ====="
          Select-String `
            -Path "source\d3d12\d3d12.cpp" `
            -Pattern "returning the original ID3D12Device" `
            -Context 4,8

          Write-Host "===== NATIVE DEVICE AND QUEUE CAPTURE ====="
          Select-String `
            -Path "source\dxgi\dxgi.cpp" `
            -Pattern "captured native ID3D12Device" `
            -Context 5,8

          Write-Host "===== PRIVATE RUNTIME HOST ====="
          Select-String `
            -Path "source\dxgi\dxgi_swapchain.cpp" `
            -Pattern "private non-COM D3D12 implementation objects" `
            -Context 12,8

          Write-Host "===== TIMESTAMP QUERY BYPASS ====="
          Select-String `
            -Path "source\d3d12\d3d12_impl_command_queue.cpp" `
            -Pattern "GPU timestamp queries disabled" `
            -Context 3,5

          $swap = Get-Content `
            "source\dxgi\dxgi_swapchain.cpp" `
            -Raw
          if ($swap.Contains(
            "static_cast<D3D12CommandQueue *>(_direct3d_command_queue)"
          )) {
            throw "Proxy-only D3D12 queue cast still remains."
          }
          if (-not $swap.Contains(
            "reshade::present_effect_runtime(_impl);"
          )) {
            throw "D3D12 effect runtime presentation is not enabled."
          }
          if ($swap.Contains("D3D12 effect runtime presentation skipped")) {
            throw "Old direct-only runtime-disable patch is present."
          }

          $entry = Get-Content `
            "source\d3d12\d3d12.cpp" `
            -Raw
          $marker = $entry.IndexOf(
            "returning the original ID3D12Device"
          )
          $return = $entry.IndexOf("return hr;", $marker)
          $proxy = $entry.IndexOf("new D3D12Device")
          if (-not (
            $marker -ge 0 -and
            $return -gt $marker -and
            $proxy -gt $return
          )) {
            throw "Native-device early-return ordering is invalid."
          }

          Write-Host "Source verification passed."

      - name: Force linker MAP into the Release x64 project configuration
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("ReShade.vcxproj")
          text = path.read_text(encoding="utf-8-sig")

          group_anchor = "<ItemDefinitionGroup Condition=\"'$(Configuration)|$(Platform)'=='Release|x64'\">"
          group_start = text.find(group_anchor)
          if group_start < 0:
              raise RuntimeError("Release|x64 ItemDefinitionGroup was not found")

          group_end = text.find("</ItemDefinitionGroup>", group_start)
          if group_end < 0:
              raise RuntimeError("Release|x64 ItemDefinitionGroup is unterminated")

          link_start = text.find("<Link>", group_start, group_end)
          link_end = text.find("</Link>", link_start, group_end)
          if link_start < 0 or link_end < 0:
              raise RuntimeError("Release|x64 Link block was not found")

          link_block = text[link_start:link_end]
          if "<GenerateMapFile>" in link_block or "<MapFileName>" in link_block:
              raise RuntimeError("Release|x64 Link block already contains MAP settings")

          insertion = (
              "<Link>\n"
              "      <GenerateMapFile>true</GenerateMapFile>\n"
              "      <MapFileName>$(ProjectDir)ReShade64.map</MapFileName>\n"
              "      <MapExports>true</MapExports>"
          )
          text = text[:link_start] + text[link_start:].replace("<Link>", insertion, 1)
          path.write_text(text, encoding="utf-8", newline="\n")

          verify = path.read_text(encoding="utf-8")
          release_group = verify[verify.find(group_anchor):verify.find("</ItemDefinitionGroup>", verify.find(group_anchor))]
          required = [
              "<GenerateMapFile>true</GenerateMapFile>",
              "<MapFileName>$(ProjectDir)ReShade64.map</MapFileName>",
              "<MapExports>true</MapExports>",
              "<GenerateDebugInformation>false</GenerateDebugInformation>",
              "<LinkTimeCodeGeneration>UseLinkTimeCodeGeneration</LinkTimeCodeGeneration>",
          ]
          for marker in required:
              if marker not in release_group:
                  raise RuntimeError(f"Missing Release|x64 linker marker: {marker}")

          print("MAP_PROJECT_PATCH_OK")
          '@ | Set-Content -Path patch_linker_map.py -Encoding utf8

          python patch_linker_map.py

          Write-Host "===== PATCHED RELEASE X64 LINK BLOCK ====="
          Select-String `
            -Path "ReShade.vcxproj" `
            -Pattern "GenerateMapFile|MapFileName|MapExports|GenerateDebugInformation|LinkTimeCodeGeneration" `
            -Context 2,2

      - name: Build layout-matching Release DLL and linker map
        shell: pwsh
        run: |
          # MAP generation is injected directly into the Release|x64 Link block.
          # This avoids relying on global MSBuild properties, which are not Link item metadata.
          msbuild ReShade.sln `
            /t:Rebuild `
            /p:Configuration=Release `
            /p:Platform="64-bit" `
            /m:1 `
            /verbosity:minimal

          if (-not (Test-Path "ReShade64.map")) {
            Write-Host "MAP candidates:"
            Get-ChildItem -Path . -Filter "*.map" -Recurse -File |
              ForEach-Object { Write-Host $_.FullName }
            throw "ReShade64.map was not emitted even though /MAP was present in ReShade.vcxproj."
          }

          Write-Host "Linker MAP produced:"
          Get-Item "ReShade64.map" | Format-List FullName,Length,LastWriteTimeUtc

      - name: Locate DLL, map, and compiler PDB
        shell: pwsh
        run: |
          $dll = Get-ChildItem `
            -Path . `
            -Filter "ReShade64.dll" `
            -Recurse `
            -File |
            Where-Object { $_.FullName -notmatch "\\deps\\" } |
            Select-Object -First 1

          if ($null -eq $dll) {
            throw "ReShade64.dll was not produced."
          }

          Write-Host "Built DLL:"
          Write-Host $dll.FullName
          Copy-Item $dll.FullName "$env:GITHUB_WORKSPACE\ReShade64.dll" -Force

          $projectMap = Join-Path $env:GITHUB_WORKSPACE "ReShade64.map"
          if (-not (Test-Path $projectMap)) {
            throw "The explicitly configured ReShade64.map was not produced."
          }

          $mapHeader = Get-Content $projectMap -TotalCount 30
          if (-not ($mapHeader -match "Preferred load address")) {
            throw "ReShade64.map does not look like an MSVC linker map."
          }

          # ReShade's Release build emits the compiler database as vc145.pdb,
          # rather than a linker database named ReShade64.pdb. Preserve it for
          # symbol/name inspection, but use the linker MAP for RVA resolution.
          $compilerPdb = Get-ChildItem `
            -Path "intermediate\ReShade" `
            -Filter "vc*.pdb" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Sort-Object Length -Descending |
            Select-Object -First 1

          if ($null -ne $compilerPdb) {
            Write-Host "Compiler PDB:"
            Write-Host $compilerPdb.FullName
            Copy-Item `
              $compilerPdb.FullName `
              "$env:GITHUB_WORKSPACE\ReShade-compiler.pdb" `
              -Force
          }
          else {
            Write-Warning "No compiler PDB was found. MAP symbolication will still run."
          }

          Write-Host "DLL SHA256:"
          (Get-FileHash "$env:GITHUB_WORKSPACE\ReShade64.dll" -Algorithm SHA256).Hash
          Write-Host "MAP size:"
          (Get-Item "$env:GITHUB_WORKSPACE\ReShade64.map").Length
      - name: Symbolicate known crash RVA
        shell: pwsh
        run: |
          $dll = "$env:GITHUB_WORKSPACE\ReShade64.dll"
          $map = "$env:GITHUB_WORKSPACE\ReShade64.map"
          $compilerPdb = "$env:GITHUB_WORKSPACE\ReShade-compiler.pdb"
          $targetRva = [Convert]::ToInt64("2F0FD", 16)
          $report = "$env:GITHUB_WORKSPACE\symbolication.txt"

          $mapLines = Get-Content $map
          $preferredBase = 0x180000000L
          foreach ($line in $mapLines) {
            if ($line -match 'Preferred load address is\s+([0-9A-Fa-f]+)') {
              $preferredBase = [Convert]::ToInt64($matches[1], 16)
              break
            }
          }
          $targetVa = $preferredBase + $targetRva

          "Crash signature from ZZZ:" | Set-Content $report
          "Module RVA: 0x2F0FD" | Add-Content $report
          "Preferred image base: 0x$($preferredBase.ToString('X'))" | Add-Content $report
          "Preferred-image VA: 0x$($targetVa.ToString('X'))" | Add-Content $report
          "Original working bridge SHA256: 454BE9B641A33D51A1B7E0E0A7601C575B811DD4C00F217302586CD0AFF837C3" | Add-Content $report
          $builtHash = (Get-FileHash $dll -Algorithm SHA256).Hash
          "Rebuilt DLL SHA256: $builtHash" | Add-Content $report
          if ($builtHash -eq "454BE9B641A33D51A1B7E0E0A7601C575B811DD4C00F217302586CD0AFF837C3") {
            "LAYOUT CHECK: exact binary hash match" | Add-Content $report
          }
          else {
            "LAYOUT CHECK: hash differs; verify crash instruction and nearest MAP symbol below" | Add-Content $report
          }

          "" | Add-Content $report
          "===== NEAREST LINKER-MAP SYMBOL =====" | Add-Content $report

          $bestValue = -1L
          $bestLine = $null
          $bestSymbol = $null
          foreach ($line in $mapLines) {
            if ($line -match '^\s*[0-9A-Fa-f]{4}:[0-9A-Fa-f]{8}\s+(\S+)\s+([0-9A-Fa-f]{16})\b') {
              $symbol = $matches[1]
              $value = [Convert]::ToInt64($matches[2], 16)
              if ($value -le $targetVa -and $value -gt $bestValue) {
                $bestValue = $value
                $bestLine = $line
                $bestSymbol = $symbol
              }
            }
          }

          if ($null -ne $bestLine) {
            "Target VA: 0x$($targetVa.ToString('X'))" | Add-Content $report
            "Nearest symbol VA: 0x$($bestValue.ToString('X'))" | Add-Content $report
            "Distance: 0x$(($targetVa - $bestValue).ToString('X'))" | Add-Content $report
            "Decorated symbol: $bestSymbol" | Add-Content $report
            $bestLine | Add-Content $report

            $undnameCandidates = @(
              "C:\Program Files\LLVM\bin\llvm-undname.exe",
              "C:\Program Files (x86)\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\x64\bin\llvm-undname.exe"
            )
            $undname = $undnameCandidates |
              Where-Object { Test-Path $_ } |
              Select-Object -First 1
            if ($null -ne $undname) {
              "Demangled symbol:" | Add-Content $report
              & $undname $bestSymbol 2>&1 | Tee-Object -FilePath $report -Append
            }
          }
          else {
            "No linker-map symbol could be parsed." | Add-Content $report
          }

          "" | Add-Content $report
          "===== DISASSEMBLY AROUND CRASH VA =====" | Add-Content $report
          $objdumpCandidates = @(
            "C:\Program Files\LLVM\bin\llvm-objdump.exe",
            "C:\Program Files (x86)\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\x64\bin\llvm-objdump.exe"
          )
          $objdump = $objdumpCandidates |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if ($null -ne $objdump) {
            $startVa = $targetVa - 96
            $stopVa = $targetVa + 96
            & $objdump `
              -d `
              --start-address=$startVa `
              --stop-address=$stopVa `
              $dll 2>&1 |
              Tee-Object -FilePath "$env:GITHUB_WORKSPACE\crash-disassembly.txt" |
              Tee-Object -FilePath $report -Append
          }
          else {
            "llvm-objdump.exe was not found." | Add-Content $report
          }

          "" | Add-Content $report
          "===== COMPILER PDB SYMBOL DUMP =====" | Add-Content $report
          if (Test-Path $compilerPdb) {
            $pdbutilCandidates = @(
              "C:\Program Files\LLVM\bin\llvm-pdbutil.exe",
              "C:\Program Files (x86)\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\x64\bin\llvm-pdbutil.exe"
            )
            $pdbutil = $pdbutilCandidates |
              Where-Object { Test-Path $_ } |
              Select-Object -First 1
            if ($null -ne $pdbutil) {
              & $pdbutil dump -publics -globals -symbols $compilerPdb `
                > "$env:GITHUB_WORKSPACE\pdb-symbols.txt"
              "Full compiler-PDB symbol dump written to pdb-symbols.txt" | Add-Content $report
            }
            else {
              "llvm-pdbutil.exe was not found." | Add-Content $report
            }
          }
          else {
            "Compiler PDB was not available." | Add-Content $report
          }

          "" | Add-Content $report
          "===== SOURCE OCCURRENCES FOR NEAREST SYMBOL =====" | Add-Content $report
          if ($null -ne $bestSymbol) {
            $needle = $bestSymbol
            if ($needle.StartsWith("?")) {
              $needle = ($needle -replace '^\?', '') -replace '@@.*$', ''
            }
            "Search token: $needle" | Add-Content $report
            Get-ChildItem source -Recurse -Include *.cpp,*.hpp -File |
              Select-String -SimpleMatch $needle -ErrorAction SilentlyContinue |
              Select-Object -First 40 |
              ForEach-Object { $_.ToString() } |
              Tee-Object -FilePath "$env:GITHUB_WORKSPACE\source-symbol-search.txt" |
              Tee-Object -FilePath $report -Append
          }

          Write-Host "===== SYMBOLICATION REPORT ====="
          Get-Content $report
      - name: Verify binary markers
        shell: pwsh
        run: |
          $dll = "$env:GITHUB_WORKSPACE\ReShade64.dll"
          $bytes = [System.IO.File]::ReadAllBytes($dll)
          $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
          $utf16 = [System.Text.Encoding]::Unicode.GetString($bytes)
          $required = @(
            "D3DMetal native runtime bridge: returning the original ID3D12Device",
            "D3DMetal native runtime bridge: captured native ID3D12Device and ID3D12CommandQueue",
            "D3DMetal native runtime bridge: ReShade runtime is hosted by private non-COM D3D12 implementation objects",
            "D3DMetal native runtime bridge: GPU timestamp queries disabled"
          )
          foreach ($marker in $required) {
            if (-not ($ascii.Contains($marker) -or $utf16.Contains($marker))) {
              throw "Binary marker missing: $marker"
            }
          }
          Write-Host "All bridge markers are embedded in the DLL."

      - name: Create build information
        shell: pwsh
        run: |
          $dll = "$env:GITHUB_WORKSPACE\ReShade64.dll"
          $hash = Get-FileHash $dll -Algorithm SHA256
          $file = Get-Item $dll

          "Build: D3DMetal Native D3D12 Runtime Bridge v2 ReShade" |
            Set-Content build-info.txt
          "Repository: $env:GITHUB_REPOSITORY" |
            Add-Content build-info.txt
          "Commit: $env:GITHUB_SHA" |
            Add-Content build-info.txt
          "Built UTC: $([DateTime]::UtcNow.ToString('o'))" |
            Add-Content build-info.txt
          "Size: $($file.Length) bytes" |
            Add-Content build-info.txt
          "SHA256: $($hash.Hash)" |
            Add-Content build-info.txt
          "Patch: Original ID3D12Device returned to game and D3DMetal" |
            Add-Content build-info.txt
          "Patch: Game-created D3D12 queues and command lists remain native" |
            Add-Content build-info.txt
          "Patch: Native pDevice is forwarded into swap-chain initialization before queue capture" |
            Add-Content build-info.txt
          "Patch: Native device and presentation queue captured at DXGI swap-chain creation" |
            Add-Content build-info.txt
          "Patch: ReShade effect runtime enabled on private non-COM D3D12 implementation objects" |
            Add-Content build-info.txt
          "Patch: DXGI swap-chain proxy retained for Present and Resize lifecycle" |
            Add-Content build-info.txt
          "Patch: GPU timestamp statistics disabled for the private bridge queue" |
            Add-Content build-info.txt
          "Test stage: Core ReShade only; keep all addon64 files disabled" |
            Add-Content build-info.txt

          Get-Content build-info.txt

      - name: Upload symbolication package
        uses: actions/upload-artifact@v4
        with:
          name: reshade-native-runtime-bridge-v2-symbolication-v3-${{ github.sha }}
          path: |
            ReShade64.dll
            ReShade64.map
            ReShade-compiler.pdb
            symbolication.txt
            crash-disassembly.txt
            pdb-symbols.txt
            source-symbol-search.txt
            build-info.txt
          if-no-files-found: error
          retention-days: 14
