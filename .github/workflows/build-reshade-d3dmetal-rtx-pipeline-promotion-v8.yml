      - name: Verify bridge source
        shell: pwsh
        run: |
          Write-Host "===== NATIVE DEVICE EARLY RETURN ====="
          Select-String `
            -Path "source\d3d12\d3d12.cpp" `
            -Pattern "returning the original ID3D12Device" `
            -Context 4,8

          Write-Host "===== NATIVE DEVICE AND QUEUE CAPTURE ====="
          Select-String `
            -Path "source\dxgi\dxgi.cpp" `
            -Pattern "captured native ID3D12Device" `
            -Context 5,8

          Write-Host "===== PRIVATE RUNTIME HOST ====="
          Select-String `
            -Path "source\dxgi\dxgi_swapchain.cpp" `
            -Pattern "private non-COM D3D12 implementation objects" `
            -Context 12,8

          Write-Host "===== TIMESTAMP QUERY BYPASS ====="
          Select-String `
            -Path "source\d3d12\d3d12_impl_command_queue.cpp" `
            -Pattern "GPU timestamp queries disabled" `
            -Context 3,5

          Write-Host "===== GENERIC DEPTH CRASH BYPASS ====="
          Select-String `
            -Path "examples\09-depth\generic_depth_addon.cpp" `
            -Pattern "Generic Depth present callback disabled" `
            -Context 6,5

          Write-Host "===== RTX COLLECTION FALLBACK ====="
          Select-String `
            -Path "source\d3d12\d3d12.cpp" `
            -Pattern "D3DMetal RTX collection fallback" `
            -Context 2,3

          $swap = Get-Content `
            "source\dxgi\dxgi_swapchain.cpp" `
            -Raw
          if ($swap.Contains(
            "static_cast<D3D12CommandQueue *>(_direct3d_command_queue)"
          )) {
            throw "Proxy-only D3D12 queue cast still remains."
          }
          if (-not $swap.Contains(
            "reshade::present_effect_runtime(_impl);"
          )) {
            throw "D3D12 effect runtime presentation is not enabled."
          }
          if ($swap.Contains("D3D12 effect runtime presentation skipped")) {
            throw "Old direct-only runtime-disable patch is present."
          }

          $entry = Get-Content `
            "source\d3d12\d3d12.cpp" `
            -Raw
          $marker = $entry.IndexOf(
            "returning the original ID3D12Device"
          )
          $return = $entry.IndexOf("return hr;", $marker)
          $proxy = $entry.IndexOf("new D3D12Device")
          if (-not (
            $marker -ge 0 -and
            $return -gt $marker -and
            $proxy -gt $return
          )) {
            throw "Native-device early-return ordering is invalid."
          }

          if (-not $entry.Contains(
            "create_state_object_vtable_index = 62"
          )) {
            throw "CreateStateObject vtable slot is not 62."
          }
          if ($entry.Contains(
            "create_state_object_vtable_index = 58"
          )) {
            throw "Obsolete slot 58 remains."
          }
          if ($entry.Contains(
            "create_state_object_vtable_index = 63"
          )) {
            throw "Incorrect prebuild-info slot 63 remains."
          }

          Write-Host "Source verification passed."

      - name: Build ReShade solution
        shell: pwsh
        run: |
          msbuild ReShade.sln `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform="64-bit" `
            /m:1 `
            /verbosity:minimal

      - name: Locate built ReShade DLL
        shell: pwsh
        run: |
          $dll = Get-ChildItem `
            -Path . `
            -Filter "ReShade64.dll" `
            -Recurse `
            -File |
            Where-Object {
              $_.FullName -notmatch "\\deps\\"
            } |
            Select-Object -First 1

          if ($null -eq $dll) {
            Write-Host "Candidate ReShade files:"
            Get-ChildItem `
              -Path . `
              -Recurse `
              -File |
              Where-Object {
                $_.Name -like "ReShade*.dll" -or
                $_.Name -like "ReShade*.exe"
              } |
              Select-Object FullName, Length |
              Format-Table -AutoSize
            throw "ReShade64.dll was not produced."
          }

          Write-Host "Built DLL:"
          Write-Host $dll.FullName
          Copy-Item `
            -Path $dll.FullName `
            -Destination "$env:GITHUB_WORKSPACE\ReShade64.dll" `
            -Force

      - name: Verify binary markers
        shell: pwsh
        run: |
          $dll = "$env:GITHUB_WORKSPACE\ReShade64.dll"
          $bytes = [System.IO.File]::ReadAllBytes($dll)
          $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
          $utf16 = [System.Text.Encoding]::Unicode.GetString($bytes)
          $required = @(
            "D3DMetal native runtime bridge: returning the original ID3D12Device",
            "D3DMetal native runtime bridge: captured native ID3D12Device and ID3D12CommandQueue",
            "D3DMetal native runtime bridge: ReShade runtime is hosted by private non-COM D3D12 implementation objects",
            "D3DMetal native runtime bridge: GPU timestamp queries disabled",
            "D3DMetal depth-safe bridge: Generic Depth present callback disabled after null-object symbolication.",
            "D3DMetal RTX pipeline promotion v8.0: native ID3D12Device5::CreateStateObject hook installed at verified slot 62",
            "D3DMetal RTX pipeline promotion v8.0: CAPTURED collection",
            "D3DMetal RTX pipeline promotion v8.0: AGGREGATE BUILD",
            "D3DMetal RTX pipeline promotion v8.0: AGGREGATE FINAL",
            "D3DMetal RTX pipeline promotion v8.0: AGGREGATION ACTIVE",
            "D3DMetal RTX pipeline promotion v8.0: RETRY BEGIN",
            "D3DMetal RTX pipeline promotion v8.0: RETRY END",
            "D3DMetal RTX pipeline promotion v8.0: WORKAROUND ACTIVE",
            "pipeline-as-collection promotion with aggregate and direct-flatten fallbacks"
          )
          foreach ($marker in $required) {
            if (-not ($ascii.Contains($marker) -or $utf16.Contains($marker))) {
              throw "Binary marker missing: $marker"
            }
          }
          Write-Host "All bridge markers are embedded in the DLL."

      - name: Create build information
        shell: pwsh
        run: |
          $dll = "$env:GITHUB_WORKSPACE\ReShade64.dll"
          $hash = Get-FileHash $dll -Algorithm SHA256
          $file = Get-Item $dll

          "Build: D3DMetal RTX Pipeline Promotion v8.0 ReShade" |
            Set-Content build-info.txt
          "Repository: $env:GITHUB_REPOSITORY" |
            Add-Content build-info.txt
          "Commit: $env:GITHUB_SHA" |
            Add-Content build-info.txt
          "Built UTC: $([DateTime]::UtcNow.ToString('o'))" |
            Add-Content build-info.txt
          "Size: $($file.Length) bytes" |
            Add-Content build-info.txt
          "SHA256: $($hash.Hash)" |
            Add-Content build-info.txt
          "Patch: Original ID3D12Device returned to game and D3DMetal" |
            Add-Content build-info.txt
          "Patch: Game-created D3D12 queues and command lists remain native" |
            Add-Content build-info.txt
          "Patch: Native pDevice is forwarded into swap-chain initialization before queue capture" |
            Add-Content build-info.txt
          "Patch: Native device and presentation queue captured at DXGI swap-chain creation" |
