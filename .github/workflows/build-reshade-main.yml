name: Build ReShade main x64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout ReShade and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Force-update submodules
        shell: pwsh
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force

          if (-not (Test-Path "deps\stb\stb_image.h")) {
            throw "stb_image.h is missing after submodule checkout."
          }

          if (-not (Test-Path "deps\glad\glad\__init__.py")) {
            throw "GLAD Python package is missing after submodule checkout."
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Show environment
        shell: pwsh
        run: |
          python --version
          msbuild -version
          git submodule status --recursive

      - name: Build ReShade solution
        shell: pwsh
        run: |
          msbuild ReShade.sln `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform="64-bit" `
            /m:1 `
            /verbosity:minimal

      - name: Locate ReShade DLL
        shell: pwsh
        run: |
          $dll = Get-ChildItem `
            -Path . `
            -Filter ReShade64.dll `
            -Recurse `
            -File |
            Select-Object -First 1

          if ($null -eq $dll) {
            Write-Host "No ReShade64.dll found. Candidate files:"
            Get-ChildItem -Path . -Recurse -File |
              Where-Object {
                $_.Name -like "ReShade*.dll" -or
                $_.Name -like "ReShade*.exe"
              } |
              Select-Object FullName, Length |
              Format-Table -AutoSize

            throw "ReShade64.dll was not produced."
          }

          Write-Host "Found:"
          Write-Host $dll.FullName

          Copy-Item `
            $dll.FullName `
            "$env:GITHUB_WORKSPACE\ReShade64.dll"

      - name: Record build information
        shell: pwsh
        run: |
          "Repository: $env:GITHUB_REPOSITORY" |
            Set-Content build-info.txt

          "Commit: $env:GITHUB_SHA" |
            Add-Content build-info.txt

          "Built UTC: $([DateTime]::UtcNow.ToString('o'))" |
            Add-Content build-info.txt

          Get-FileHash `
            "$env:GITHUB_WORKSPACE\ReShade64.dll" `
            -Algorithm SHA256 |
            Format-List |
            Out-String |
            Add-Content build-info.txt

      - name: Upload ReShade build
        uses: actions/upload-artifact@v4
        with:
          name: reshade-main-x64-${{ github.sha }}
          path: |
            ReShade64.dll
            build-info.txt
          if-no-files-found: error
