name: Build ReShade D3DMetal True Native-Device DXGI-Retained x64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout ReShade and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Force-update submodules
        shell: pwsh
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force
          if (-not (Test-Path "deps\stb\stb_image.h")) {
            throw "ERROR: stb_image.h is missing."
          }
          if (-not (Test-Path "deps\glad\glad\__init__.py")) {
            throw "ERROR: GLAD Python files are missing."
          }
          Write-Host "Submodules are complete."
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Show build environment
        shell: pwsh
        run: |
          python --version
          msbuild -version
          git rev-parse HEAD
          git submodule status --recursive
      - name: Patch true native device, queues/lists, and swap-chain safety
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re
          # =================================================
          # PATCH 1:
          # Disable the ordinary D3D12 ReShade effect runtime
          # while preserving the add-on event system.
          # =================================================
          swapchain_path = Path(
              "source/dxgi/dxgi_swapchain.cpp"
          )
          if not swapchain_path.is_file():
              raise RuntimeError(
                  "source/dxgi/dxgi_swapchain.cpp was not found."
              )
          source = swapchain_path.read_text(
              encoding="utf-8-sig"
          )
          init_start = source.find(
              "void DXGISwapChain::on_init("
          )
          reset_start = source.find(
              "void DXGISwapChain::on_reset(",
              init_start,
          )
          present_start = source.find(
              "void DXGISwapChain::on_present(",
              reset_start,
          )
          if init_start < 0:
              raise RuntimeError(
                  "Could not find DXGISwapChain::on_init."
              )
          if reset_start < 0:
              raise RuntimeError(
                  "Could not find DXGISwapChain::on_reset."
              )
          if present_start < 0:
              raise RuntimeError(
                  "Could not find DXGISwapChain::on_present."
              )
          init_block = source[
              init_start:reset_start
          ]
          reset_block = source[
              reset_start:present_start
          ]
          present_block = source[
              present_start:
          ]
          init_old = (
              "\treshade::init_effect_runtime(_impl);"
          )
          init_new = (
              "\tif (_direct3d_version != "
              "reshade::api::device_api::d3d12)\n"
              "\t{\n"
              "\t\treshade::init_effect_runtime(_impl);\n"
              "\t}\n"
              "\telse\n"
              "\t{\n"
              "\t\treshade::log::message(\n"
              "\t\t\treshade::log::level::info,\n"
              "\t\t\t\"D3DMetal direct-only core: "
              "D3D12 effect runtime initialization skipped; "
              "add-on events remain active.\");\n"
              "\t}"
          )
          if init_block.count(init_old) != 1:
              raise RuntimeError(
                  "Expected exactly one init_effect_runtime "
                  "call inside on_init."
              )
          init_block = init_block.replace(
              init_old,
              init_new,
              1,
          )
          reset_old = (
              "\treshade::reset_effect_runtime(_impl);"
          )
          reset_new = (
              "\tif (_direct3d_version != "
              "reshade::api::device_api::d3d12)\n"
              "\t{\n"
              "\t\treshade::reset_effect_runtime(_impl);\n"
              "\t}\n"
              "\telse\n"
              "\t{\n"
              "\t\treshade::log::message(\n"
              "\t\t\treshade::log::level::info,\n"
              "\t\t\t\"D3DMetal direct-only core: "
              "D3D12 effect runtime reset skipped.\");\n"
              "\t}"
          )
          if reset_block.count(reset_old) != 1:
              raise RuntimeError(
                  "Expected exactly one reset_effect_runtime "
                  "call inside on_reset."
              )
          reset_block = reset_block.replace(
              reset_old,
              reset_new,
              1,
          )
          present_pattern = re.compile(
              r"(?m)^(?P<indent>[ \t]*)"
              r"reshade::present_effect_runtime"
              r"\(_impl\);"
          )
          present_matches = list(
              present_pattern.finditer(present_block)
          )
          if len(present_matches) != 3:
              raise RuntimeError(
                  "Expected exactly three "
                  "present_effect_runtime calls, found "
                  + str(len(present_matches))
                  + "."
              )
          d3d12_present = present_matches[2]
          indent = d3d12_present.group("indent")
          present_replacement = (
              indent
              + "reshade::log::message(\n"
              + indent
              + "\treshade::log::level::info,\n"
              + indent
              + "\t\"D3DMetal direct-only core: "
              + "D3D12 effect runtime presentation skipped.\");"
          )
          present_block = (
              present_block[:d3d12_present.start()]
              + present_replacement
              + present_block[d3d12_present.end():]
          )

          # With command-queue proxying disabled, the D3D12 swap-chain
          # must not cast the native D3DMetal queue to D3D12CommandQueue.
          flush_pattern = re.compile(
              r"(?m)^(?P<indent>[ \t]*)"
              r"static_cast<D3D12CommandQueue \*>"
              r"\(_direct3d_command_queue\)"
              r"->flush_immediate_command_list\(\);"
          )
          flush_matches = list(
              flush_pattern.finditer(present_block)
          )
          if len(flush_matches) != 1:
              raise RuntimeError(
                  "Expected exactly one proxy-only D3D12 queue flush, found "
                  + str(len(flush_matches))
                  + "."
              )
          queue_flush = flush_matches[0]
          flush_indent = queue_flush.group("indent")
          flush_replacement = (
              flush_indent
              + "reshade::log::message(\n"
              + flush_indent
              + "\treshade::log::level::info,\n"
              + flush_indent
              + "\t\"D3DMetal no-queue diagnostic: "
              + "proxy-only swap-chain queue flush skipped.\");"
          )
          present_block = (
              present_block[:queue_flush.start()]
              + flush_replacement
              + present_block[queue_flush.end():]
          )

          source = (
              source[:init_start]
              + init_block
              + reset_block
              + present_block
          )
          swapchain_path.write_text(
              source,
              encoding="utf-8",
              newline="\n",
          )
          # =================================================
          # PATCH 2:
          # Do not wrap any D3D12 command queues.
          #
          # Direct, compute and copy queues remain native D3DMetal objects.
          # =================================================
          device_path = Path(
              "source/d3d12/d3d12_device.cpp"
          )
          if not device_path.is_file():
              raise RuntimeError(
                  "source/d3d12/d3d12_device.cpp was not found."
              )
          device_source = device_path.read_text(
              encoding="utf-8-sig"
          )
          queue_start = device_source.find(
              "HRESULT STDMETHODCALLTYPE "
              "D3D12Device::CreateCommandQueue("
          )
          queue_end = device_source.find(
              "HRESULT STDMETHODCALLTYPE "
              "D3D12Device::CreateCommandAllocator(",
              queue_start,
          )
          if queue_start < 0 or queue_end < 0:
              raise RuntimeError(
                  "Could not isolate CreateCommandQueue."
              )
          queue_block = device_source[
              queue_start:queue_end
          ]
          queue_condition = (
              "if (SUCCEEDED(hr))"
          )
          queue_replacement = (
              "if (false) "
              "// D3DMetal no-queue diagnostic"
          )
          if queue_block.count(queue_condition) != 1:
              raise RuntimeError(
                  "Expected exactly one successful queue "
                  "condition, found "
                  + str(queue_block.count(queue_condition))
                  + "."
              )
          queue_block = queue_block.replace(
              queue_condition,
              queue_replacement,
              1,
          )
          # =================================================
          # PATCH 3:
          # Do not wrap any graphics command lists.
          #
          # All game-created command lists remain native D3DMetal objects.
          # =================================================
          list_start = device_source.find(
              "HRESULT STDMETHODCALLTYPE "
              "D3D12Device::CreateCommandList("
          )
          list_end = device_source.find(
              "HRESULT STDMETHODCALLTYPE "
              "D3D12Device::CheckFeatureSupport(",
              list_start,
          )
          if list_start < 0 or list_end < 0:
              raise RuntimeError(
                  "Could not isolate CreateCommandList."
              )
          list_block = device_source[
              list_start:list_end
          ]
          list_condition = (
              "if (type >= "
              "D3D12_COMMAND_LIST_TYPE_DIRECT && "
              "type <= "
              "D3D12_COMMAND_LIST_TYPE_COPY)"
          )
          list_replacement = (
              "if (false) "
              "// D3DMetal no-command-list diagnostic"
          )
          if list_block.count(list_condition) != 1:
              raise RuntimeError(
                  "Expected exactly one command-list "
                  "type range, found "
                  + str(list_block.count(list_condition))
                  + "."
              )
          list_block = list_block.replace(
              list_condition,
              list_replacement,
              1,
          )
          device_source = (
              device_source[:queue_start]
              + queue_block
              + device_source[
                  queue_end:list_start
              ]
              + list_block
              + device_source[list_end:]
          )
          device_path.write_text(
              device_source,
              encoding="utf-8",
              newline="\n",
          )

          # =================================================
          # PATCH 4:
          # Return the native D3DMetal ID3D12Device.
          #
          # Insert an early return after the original D3D12CreateDevice
          # call succeeds and before any D3D12Device proxy lookup or
          # construction can execute.
          #
          # DXGI factory/swap-chain interception remains enabled.
          # =================================================
          d3d12_entry_path = Path(
              "source/d3d12/d3d12.cpp"
          )
          if not d3d12_entry_path.is_file():
              raise RuntimeError(
                  "source/d3d12/d3d12.cpp was not found."
              )

          d3d12_entry_source = d3d12_entry_path.read_text(
              encoding="utf-8-sig"
          )

          create_start = d3d12_entry_source.find(
              "D3D12CreateDevice("
          )
          if create_start < 0:
              raise RuntimeError(
                  "Could not find D3D12CreateDevice."
              )

          create_body_start = d3d12_entry_source.find(
              "{",
              create_start,
          )
          if create_body_start < 0:
              raise RuntimeError(
                  "Could not find D3D12CreateDevice body."
              )

          depth = 0
          create_body_end = -1
          for index in range(
              create_body_start,
              len(d3d12_entry_source),
          ):
              char = d3d12_entry_source[index]
              if char == "{":
                  depth += 1
              elif char == "}":
                  depth -= 1
                  if depth == 0:
                      create_body_end = index + 1
                      break

          if create_body_end < 0:
              raise RuntimeError(
                  "Could not isolate D3D12CreateDevice body."
              )

          create_block = d3d12_entry_source[
              create_start:create_body_end
          ]

          proxy_anchor = (
              "\t// The returned device should alway implement "
              "the 'ID3D12Device' base interface"
          )
          if create_block.count(proxy_anchor) != 1:
              raise RuntimeError(
                  "Expected exactly one D3D12 proxy-block anchor, "
                  "found "
                  + str(create_block.count(proxy_anchor))
                  + "."
              )

          native_return = (
              "#if RESHADE_ADDON >= 2\n"
              "\t// Balance the add-on manager reference acquired "
              "above without constructing a device proxy.\n"
              "\treshade::unload_addons();\n"
              "#endif\n"
              "\treshade::log::message(\n"
              "\t\treshade::log::level::info,\n"
              "\t\t\"D3DMetal true-native-device diagnostic: "
              "returning original ID3D12Device before all "
              "ReShade D3D12Device proxy logic.\");\n"
              "\treturn hr;\n\n"
              + proxy_anchor
          )

          create_block = create_block.replace(
              proxy_anchor,
              native_return,
              1,
          )

          d3d12_entry_source = (
              d3d12_entry_source[:create_start]
              + create_block
              + d3d12_entry_source[create_body_end:]
          )

          d3d12_entry_path.write_text(
              d3d12_entry_source,
              encoding="utf-8",
              newline="\n",
          )

          # =================================================
          # Verification
          # =================================================
          swap_verify = swapchain_path.read_text(
              encoding="utf-8"
          )
          device_verify = device_path.read_text(
              encoding="utf-8"
          )

          d3d12_entry_verify = d3d12_entry_path.read_text(
              encoding="utf-8"
          )
          required_swapchain_strings = [
              "D3DMetal direct-only core: "
              "D3D12 effect runtime initialization skipped",
              "D3DMetal direct-only core: "
              "D3D12 effect runtime reset skipped",
              "D3DMetal direct-only core: "
              "D3D12 effect runtime presentation skipped",
              "D3DMetal no-queue diagnostic: "
              "proxy-only swap-chain queue flush skipped",
              "reshade::addon_event::init_swapchain",
              "reshade::addon_event::destroy_swapchain",
              "reshade::addon_event::present",
          ]
          for required in required_swapchain_strings:
              if required not in swap_verify:
                  raise RuntimeError(
                      "Swap-chain patch verification failed: "
                      + required
                  )
          required_device_strings = [
              "D3DMetal no-queue diagnostic",
              "D3DMetal no-command-list diagnostic",
              "if (false) "
              "// D3DMetal no-queue diagnostic",
              "if (false) "
              "// D3DMetal no-command-list diagnostic",
          ]
          for required in required_device_strings:
              if required not in device_verify:
                  raise RuntimeError(
                      "Device patch verification failed: "
                      + required
                  )

          required_entry_strings = [
              "D3DMetal true-native-device diagnostic: "
              "returning original ID3D12Device before all "
              "ReShade D3D12Device proxy logic",
              "reshade::unload_addons();",
              "new D3D12Device",
          ]

          for required in required_entry_strings:
              if required not in d3d12_entry_verify:
                  raise RuntimeError(
                      "D3D12 entry-point patch verification failed: "
                      + required
                  )

          marker_pos = d3d12_entry_verify.find(
              "D3DMetal true-native-device diagnostic:"
          )
          return_pos = d3d12_entry_verify.find(
              "return hr;",
              marker_pos,
          )
          proxy_pos = d3d12_entry_verify.find(
              "new D3D12Device",
          )

          if not (
              marker_pos >= 0
              and return_pos > marker_pos
              and proxy_pos > return_pos
          ):
              raise RuntimeError(
                  "True native-device early-return ordering "
                  "verification failed."
              )

          if (
              "if (false) "
              "// D3DMetal native-device diagnostic"
              in d3d12_entry_verify
          ):
              raise RuntimeError(
                  "The invalid old native-device guard patch "
                  "is still present."
              )
          if (
              "static_cast<D3D12CommandQueue *>"
              "(_direct3d_command_queue)"
              "->flush_immediate_command_list();"
              in swap_verify
          ):
              raise RuntimeError(
                  "Proxy-only D3D12 queue flush is still present."
              )

          remaining_present_calls = swap_verify.count(
              "reshade::present_effect_runtime(_impl);"
          )
          if remaining_present_calls != 2:
              raise RuntimeError(
                  "Expected two remaining D3D10/D3D11 "
                  "present calls, found "
                  + str(remaining_present_calls)
                  + "."
              )
          print("Patch completed.")
          print("D3D12 effect runtime disabled.")
          print("Add-on events preserved.")
          print("No D3D12 command queues are proxied.")
          print("No D3D12 command lists are proxied.")
          print("Proxy-only D3D12 swap-chain queue flush disabled.")
          print("D3D12CreateDevice now returns before every ReShade D3D12Device proxy path.")
          print("DXGI factory and swap-chain interception retained.")
          print("The returned device, queues and command lists remain native.")
          '@ | Set-Content `
            -Path patch_d3dmetal_direct_only.py `
            -Encoding utf8
          python patch_d3dmetal_direct_only.py
      - name: Verify patched source
        shell: pwsh
        run: |
          Write-Host "===== TRUE NATIVE-DEVICE DXGI-RETAINED MARKERS ====="
          Select-String `
            -Path "source\dxgi\dxgi_swapchain.cpp" `
            -Pattern "D3DMetal direct-only core" `
            -Context 2,2
          Write-Host "===== NATIVE DEVICE BYPASS ====="
          Select-String `
            -Path "source\d3d12\d3d12.cpp" `
            -Pattern "D3DMetal true-native-device diagnostic" `
            -Context 4,8
          Write-Host "===== SWAP-CHAIN QUEUE FLUSH BYPASS ====="
          Select-String `
            -Path "source\dxgi\dxgi_swapchain.cpp" `
            -Pattern "proxy-only swap-chain queue flush skipped" `
            -Context 4,4
          Write-Host "===== QUEUE BYPASS PATCH ====="
          Select-String `
            -Path "source\d3d12\d3d12_device.cpp" `
            -Pattern "D3DMetal no-queue diagnostic" `
            -Context 4,4
          Write-Host "===== COMMAND-LIST BYPASS PATCH ====="
          Select-String `
            -Path "source\d3d12\d3d12_device.cpp" `
            -Pattern `
              "D3DMetal no-command-list diagnostic" `
            -Context 4,4
      - name: Build ReShade solution
        shell: pwsh
        run: |
          msbuild ReShade.sln `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform="64-bit" `
            /m:1 `
            /verbosity:minimal
      - name: Locate built ReShade DLL
        shell: pwsh
        run: |
          $dll = Get-ChildItem `
            -Path . `
            -Filter "ReShade64.dll" `
            -Recurse `
            -File |
            Where-Object {
              $_.FullName -notmatch "\\deps\\"
            } |
            Select-Object -First 1
          if ($null -eq $dll) {
            Write-Host "Candidate ReShade files:"
            Get-ChildItem `
              -Path . `
              -Recurse `
              -File |
              Where-Object {
                $_.Name -like "ReShade*.dll" -or
                $_.Name -like "ReShade*.exe"
              } |
              Select-Object FullName, Length |
              Format-Table -AutoSize
            throw "ReShade64.dll was not produced."
          }
          Write-Host "Built DLL:"
          Write-Host $dll.FullName
          Copy-Item `
            -Path $dll.FullName `
            -Destination "$env:GITHUB_WORKSPACE\ReShade64.dll" `
            -Force
          if (-not (
            Test-Path "$env:GITHUB_WORKSPACE\ReShade64.dll"
          )) {
            throw "Failed to copy ReShade64.dll."
          }
      - name: Create build information
        shell: pwsh
        run: |
          $dll = "$env:GITHUB_WORKSPACE\ReShade64.dll"
          $hash = Get-FileHash $dll -Algorithm SHA256
          $file = Get-Item $dll
          "Build: D3DMetal True Native-Device DXGI-Retained ReShade" |
            Set-Content build-info.txt
          "Repository: $env:GITHUB_REPOSITORY" |
            Add-Content build-info.txt
          "Commit: $env:GITHUB_SHA" |
            Add-Content build-info.txt
          "Built UTC: $([DateTime]::UtcNow.ToString('o'))" |
            Add-Content build-info.txt
          "Size: $($file.Length) bytes" |
            Add-Content build-info.txt
          "SHA256: $($hash.Hash)" |
            Add-Content build-info.txt
          "Patch: D3D12 effect runtime disabled" |
            Add-Content build-info.txt
          "Patch: Add-on events preserved" |
            Add-Content build-info.txt
          "Patch: No D3D12 command queues proxied" |
            Add-Content build-info.txt
          "Patch: Proxy-only D3D12 swap-chain queue flush disabled" |
            Add-Content build-info.txt
          "Patch: D3D12CreateDevice returns before all ReShade D3D12Device proxy logic" |
            Add-Content build-info.txt
          "Patch: DXGI factory and swap-chain interception retained" |
            Add-Content build-info.txt
          "Patch: No D3D12 command lists proxied" |
            Add-Content build-info.txt
          Get-Content build-info.txt
      - name: Upload patched ReShade
        uses: actions/upload-artifact@v4
        with:
          name: reshade-d3dmetal-true-native-device-dxgi-retained-${{ github.sha }}
          path: |
            ReShade64.dll
            build-info.txt
          if-no-files-found: error
          retention-days: 14
