name: Build ReShade main x64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout ReShade
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Show build environment
        shell: pwsh
        run: |
          python --version
          msbuild -version
          Get-ChildItem -Name

      - name: Build ReShade x64
        shell: pwsh
        run: |
          msbuild ReShade.vcxproj `
            /m `
            /restore `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /verbosity:minimal

      - name: Locate ReShade64 DLL
        id: locate
        shell: pwsh
        run: |
          $dll = Get-ChildItem `
            -Path . `
            -Filter ReShade64.dll `
            -Recurse `
            -File |
            Select-Object -First 1

          if ($null -eq $dll) {
            Write-Host "ReShade64.dll was not found. Files named ReShade*:"
            Get-ChildItem -Path . -Filter "ReShade*" -Recurse |
              Select-Object FullName, Length |
              Format-Table -AutoSize
            throw "Build completed without producing ReShade64.dll."
          }

          Write-Host "Found DLL:"
          Write-Host $dll.FullName

          Copy-Item $dll.FullName `
            "$env:GITHUB_WORKSPACE\ReShade64.dll"

      - name: Record build information
        shell: pwsh
        run: |
          "Repository: $env:GITHUB_REPOSITORY" |
            Set-Content build-info.txt

          "Commit: $env:GITHUB_SHA" |
            Add-Content build-info.txt

          "Built UTC: $([DateTime]::UtcNow.ToString('o'))" |
            Add-Content build-info.txt

          Get-FileHash `
            "$env:GITHUB_WORKSPACE\ReShade64.dll" `
            -Algorithm SHA256 |
            Format-List |
            Out-String |
            Add-Content build-info.txt

      - name: Upload ReShade build
        uses: actions/upload-artifact@v4
        with:
          name: reshade-main-x64-${{ github.sha }}
          path: |
            ReShade64.dll
            build-info.txt
          if-no-files-found: error
