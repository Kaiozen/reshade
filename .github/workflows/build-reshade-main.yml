name: Build ReShade D3DMetal Delayed Init x64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout ReShade and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Force-update submodules
        shell: pwsh
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force

          if (-not (Test-Path "deps\stb\stb_image.h")) {
            throw "ERROR: stb_image.h is missing."
          }

          if (-not (Test-Path "deps\glad\glad\__init__.py")) {
            throw "ERROR: GLAD Python package is missing."
          }

          Write-Host "Submodules are complete."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Show build environment
        shell: pwsh
        run: |
          python --version
          msbuild -version
          git rev-parse HEAD
          git submodule status --recursive

      - name: Patch delayed D3D12 runtime initialization
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("source/dxgi/dxgi_swapchain.cpp")

          if not path.is_file():
              raise RuntimeError(
                  "source/dxgi/dxgi_swapchain.cpp was not found."
              )

          source = path.read_text(
              encoding="utf-8-sig"
          )

          constructor_start_marker = (
              "DXGISwapChain::DXGISwapChain("
              "IDXGIFactory *factory, "
              "D3D12CommandQueue *command_queue, "
              "IDXGISwapChain3 *original)"
          )

          destructor_marker = (
              "DXGISwapChain::~DXGISwapChain()"
          )

          constructor_start = source.find(
              constructor_start_marker
          )

          if constructor_start < 0:
              raise RuntimeError(
                  "Could not find the D3D12 swap-chain constructor."
              )

          constructor_end = source.find(
              destructor_marker,
              constructor_start,
          )

          if constructor_end < 0:
              raise RuntimeError(
                  "Could not locate the end of the D3D12 constructor."
              )

          constructor = source[
              constructor_start:constructor_end
          ]

          original = (
              "\treshade::create_effect_runtime("
              "_impl, command_queue);\n"
              "\ton_init(false);"
          )

          replacement = (
              "\treshade::create_effect_runtime("
              "_impl, command_queue);\n"
              "\n"
              "\t// D3DMetal compatibility:\n"
              "\t// ZZZ performs a startup ResizeBuffers call "
              "shortly after creating\n"
              "\t// the D3D12 swap chain. Initializing here "
              "would immediately force\n"
              "\t// ReShade to destroy and recreate all runtime "
              "resources. Leave the\n"
              "\t// runtime uninitialized until the successful "
              "ResizeBuffers call invokes\n"
              "\t// on_init(true).\n"
              "\treshade::log::message(\n"
              "\t\treshade::log::level::info,\n"
              "\t\t\"D3DMetal compatibility: delaying initial "
              "D3D12 runtime initialization until "
              "ResizeBuffers.\");"
          )

          if original not in constructor:
              raise RuntimeError(
                  "Could not find the immediate D3D12 on_init call."
              )

          patched_constructor = constructor.replace(
              original,
              replacement,
              1,
          )

          if patched_constructor.count(
              "delaying initial D3D12 runtime initialization"
          ) != 1:
              raise RuntimeError(
                  "Delayed initialization marker count is invalid."
              )

          source = (
              source[:constructor_start]
              + patched_constructor
              + source[constructor_end:]
          )

          # Ensure the normal ResizeBuffers path remains intact.
          required_resize_fragments = [
              "HRESULT STDMETHODCALLTYPE "
              "DXGISwapChain::ResizeBuffers(",
              "on_reset(true);",
              "_orig->ResizeBuffers(",
              "on_init(true);",
          ]

          for fragment in required_resize_fragments:
              if fragment not in source:
                  raise RuntimeError(
                      "Required ResizeBuffers code is missing: "
                      + fragment
                  )

          path.write_text(
              source,
              encoding="utf-8",
              newline="\n",
          )

          verification = path.read_text(
              encoding="utf-8"
          )

          if (
              "D3DMetal compatibility: delaying initial "
              "D3D12 runtime initialization"
              not in verification
          ):
              raise RuntimeError(
                  "Patch verification failed."
              )

          print("Delayed D3D12 initialization patch applied.")
          print(
              "The runtime will initialize after ZZZ's "
              "first successful ResizeBuffers call."
          )
          '@ | Set-Content `
            -Path patch_delayed_d3d12_init.py `
            -Encoding utf8

          python patch_delayed_d3d12_init.py

      - name: Verify patched source
        shell: pwsh
        run: |
          Write-Host "===== DELAYED INIT PATCH ====="

          Select-String `
            -Path "source\dxgi\dxgi_swapchain.cpp" `
            -Pattern `
              "delaying initial D3D12 runtime", `
              "on_init\(true\)" `
            -Context 4,4

      - name: Build ReShade solution
        shell: pwsh
        run: |
          msbuild ReShade.sln `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform="64-bit" `
            /m:1 `
            /verbosity:minimal

      - name: Locate built ReShade DLL
        shell: pwsh
        run: |
          $dll = Get-ChildItem `
            -Path . `
            -Filter "ReShade64.dll" `
            -Recurse `
            -File |
            Where-Object {
              $_.FullName -notmatch "\\deps\\"
            } |
            Select-Object -First 1

          if ($null -eq $dll) {
            Write-Host "Candidate files:"

            Get-ChildItem `
              -Path . `
              -Recurse `
              -File |
              Where-Object {
                $_.Name -like "ReShade*.dll" -or
                $_.Name -like "ReShade*.exe"
              } |
              Select-Object FullName, Length |
              Format-Table -AutoSize

            throw "ReShade64.dll was not produced."
          }

          Write-Host "Built DLL:"
          Write-Host $dll.FullName

          Copy-Item `
            -Path $dll.FullName `
            -Destination "$env:GITHUB_WORKSPACE\ReShade64.dll" `
            -Force

          if (-not (
            Test-Path "$env:GITHUB_WORKSPACE\ReShade64.dll"
          )) {
            throw "Failed to copy ReShade64.dll."
          }

      - name: Create build information
        shell: pwsh
        run: |
          $dll = "$env:GITHUB_WORKSPACE\ReShade64.dll"
          $hash = Get-FileHash $dll -Algorithm SHA256
          $file = Get-Item $dll

          "Build: D3DMetal Delayed-Init ReShade" |
            Set-Content build-info.txt

          "Repository: $env:GITHUB_REPOSITORY" |
            Add-Content build-info.txt

          "Commit: $env:GITHUB_SHA" |
            Add-Content build-info.txt

          "Built UTC: $([DateTime]::UtcNow.ToString('o'))" |
            Add-Content build-info.txt

          "Size: $($file.Length) bytes" |
            Add-Content build-info.txt

          "SHA256: $($hash.Hash)" |
            Add-Content build-info.txt

          "Patch: Initial D3D12 runtime initialization delayed" |
            Add-Content build-info.txt

          "Patch: Runtime initializes after first ResizeBuffers" |
            Add-Content build-info.txt

          Get-Content build-info.txt

      - name: Upload patched ReShade
        uses: actions/upload-artifact@v4
        with:
          name: reshade-d3dmetal-delayed-init-${{ github.sha }}
          path: |
            ReShade64.dll
            build-info.txt
          if-no-files-found: error
          retention-days: 14
