      - name: Patch D3DMetal query paths
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          runtime_path = Path("source/runtime.cpp")
          command_list_path = Path(
              "source/d3d12/d3d12_command_list.cpp"
          )

          runtime = runtime_path.read_text(
              encoding="utf-8-sig"
          )

          timestamp_line = (
              "_timestamp_frequency = "
              "graphics_queue->get_timestamp_frequency();"
          )

          if timestamp_line not in runtime:
              raise RuntimeError(
                  "Could not find timestamp-frequency line."
              )

          runtime = runtime.replace(
              timestamp_line,
              "_timestamp_frequency = 0; "
              "// D3DMetal compatibility: disable GPU timing",
              1,
          )

          query_heap_marker = (
              "// Create optional query heap for time measurements\n"
              "\tif (permutation_index == 0 &&"
          )

          if query_heap_marker not in runtime:
              raise RuntimeError(
                  "Could not find ReShade query-heap creation."
              )

          runtime = runtime.replace(
              query_heap_marker,
              "// D3DMetal compatibility: query heap disabled\n"
              "\tif (false && permutation_index == 0 &&",
              1,
          )

          runtime_path.write_text(
              runtime,
              encoding="utf-8",
          )

          source = command_list_path.read_text(
              encoding="utf-8-sig"
          )

          def replace_method(
              text: str,
              start_marker: str,
              next_marker: str,
              replacement: str,
          ) -> str:
              start = text.find(start_marker)

              if start < 0:
                  raise RuntimeError(
                      f"Missing method: {start_marker}"
                  )

              end = text.find(next_marker, start)

              if end < 0:
                  raise RuntimeError(
                      f"Missing next method: {next_marker}"
                  )

              return (
                  text[:start]
                  + replacement.rstrip()
                  + "\n\n"
                  + text[end:]
              )

          begin_signature = (
              "void STDMETHODCALLTYPE "
              "D3D12GraphicsCommandList::BeginQuery("
          )

          end_signature = (
              "void STDMETHODCALLTYPE "
              "D3D12GraphicsCommandList::EndQuery("
          )

          resolve_signature = (
              "void STDMETHODCALLTYPE "
              "D3D12GraphicsCommandList::ResolveQueryData("
          )

          predication_signature = (
              "void STDMETHODCALLTYPE "
              "D3D12GraphicsCommandList::SetPredication("
          )

          source = replace_method(
              source,
              begin_signature,
              end_signature,
              r'''
          void STDMETHODCALLTYPE D3D12GraphicsCommandList::BeginQuery(
              ID3D12QueryHeap *pQueryHeap,
              D3D12_QUERY_TYPE Type,
              UINT Index)
          {
              // Bypass ReShade query events on D3DMetal.
              _orig->BeginQuery(pQueryHeap, Type, Index);
          }
          ''',
          )

          source = replace_method(
              source,
              end_signature,
              resolve_signature,
              r'''
          void STDMETHODCALLTYPE D3D12GraphicsCommandList::EndQuery(
              ID3D12QueryHeap *pQueryHeap,
              D3D12_QUERY_TYPE Type,
              UINT Index)
          {
              // Bypass ReShade query events on D3DMetal.
              _orig->EndQuery(pQueryHeap, Type, Index);
          }
          ''',
          )

          source = replace_method(
              source,
              resolve_signature,
              predication_signature,
              r'''
          void STDMETHODCALLTYPE D3D12GraphicsCommandList::ResolveQueryData(
              ID3D12QueryHeap *pQueryHeap,
              D3D12_QUERY_TYPE Type,
              UINT StartIndex,
              UINT NumQueries,
              ID3D12Resource *pDestinationBuffer,
              UINT64 AlignedDestinationBufferOffset)
          {
              // Bypass ReShade query events on D3DMetal.
              _orig->ResolveQueryData(
                  pQueryHeap,
                  Type,
                  StartIndex,
                  NumQueries,
                  pDestinationBuffer,
                  AlignedDestinationBufferOffset
              );
          }
          ''',
          )

          command_list_path.write_text(
              source,
              encoding="utf-8",
          )

          print("D3DMetal query patch applied.")
          print("GPU timing disabled.")
          print("D3D12 query event interception disabled.")
          '@ | Set-Content -Encoding utf8 patch_d3dmetal.py

          python patch_d3dmetal.py
