name: Build ReShade D3DMetal Addon Core x64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout ReShade and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Force-update submodules
        shell: pwsh
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force

          if (-not (Test-Path "deps\stb\stb_image.h")) {
            throw "ERROR: stb_image.h is missing."
          }

          if (-not (Test-Path "deps\glad\glad\__init__.py")) {
            throw "ERROR: GLAD Python files are missing."
          }

          Write-Host "Submodules are complete."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Show build environment
        shell: pwsh
        run: |
          python --version
          msbuild -version
          git rev-parse HEAD
          git submodule status --recursive

      - name: Patch D3D12 add-on-core mode
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          path = Path("source/dxgi/dxgi_swapchain.cpp")

          if not path.is_file():
              raise RuntimeError(
                  "source/dxgi/dxgi_swapchain.cpp was not found."
              )

          source = path.read_text(
              encoding="utf-8-sig"
          )

          init_start = source.find(
              "void DXGISwapChain::on_init("
          )

          reset_start = source.find(
              "void DXGISwapChain::on_reset(",
              init_start,
          )

          present_start = source.find(
              "void DXGISwapChain::on_present(",
              reset_start,
          )

          if init_start < 0:
              raise RuntimeError(
                  "Could not find DXGISwapChain::on_init."
              )

          if reset_start < 0:
              raise RuntimeError(
                  "Could not find DXGISwapChain::on_reset."
              )

          if present_start < 0:
              raise RuntimeError(
                  "Could not find DXGISwapChain::on_present."
              )

          init_block = source[
              init_start:reset_start
          ]

          reset_block = source[
              reset_start:present_start
          ]

          present_block = source[
              present_start:
          ]

          # -------------------------------------------------
          # Keep add-on init events active.
          # Skip only normal ReShade FX/runtime initialization
          # for DirectX 12.
          # -------------------------------------------------

          init_old = (
              "\treshade::init_effect_runtime(_impl);"
          )

          init_new = (
              "\tif (_direct3d_version != "
              "reshade::api::device_api::d3d12)\n"
              "\t{\n"
              "\t\treshade::init_effect_runtime(_impl);\n"
              "\t}\n"
              "\telse\n"
              "\t{\n"
              "\t\treshade::log::message(\n"
              "\t\t\treshade::log::level::info,\n"
              "\t\t\t\"D3DMetal add-on-core: "
              "D3D12 effect runtime initialization skipped; "
              "add-on events remain active.\");\n"
              "\t}"
          )

          if init_block.count(init_old) != 1:
              raise RuntimeError(
                  "Expected exactly one init_effect_runtime "
                  "call inside on_init."
              )

          init_block = init_block.replace(
              init_old,
              init_new,
              1,
          )

          # -------------------------------------------------
          # Keep add-on destroy_swapchain events active.
          # Skip normal effect-runtime reset for DirectX 12.
          # -------------------------------------------------

          reset_old = (
              "\treshade::reset_effect_runtime(_impl);"
          )

          reset_new = (
              "\tif (_direct3d_version != "
              "reshade::api::device_api::d3d12)\n"
              "\t{\n"
              "\t\treshade::reset_effect_runtime(_impl);\n"
              "\t}\n"
              "\telse\n"
              "\t{\n"
              "\t\treshade::log::message(\n"
              "\t\t\treshade::log::level::info,\n"
              "\t\t\t\"D3DMetal add-on-core: "
              "D3D12 effect runtime reset skipped.\");\n"
              "\t}"
          )

          if reset_block.count(reset_old) != 1:
              raise RuntimeError(
                  "Expected exactly one reset_effect_runtime "
                  "call inside on_reset."
              )

          reset_block = reset_block.replace(
              reset_old,
              reset_new,
              1,
          )

          # -------------------------------------------------
          # There are three present_effect_runtime calls:
          # D3D10, D3D11 and D3D12.
          #
          # Remove only the third one, which belongs to D3D12.
          # Add-on present events remain untouched.
          # -------------------------------------------------

          present_pattern = re.compile(
              r"(?m)^(?P<indent>[ \t]*)"
              r"reshade::present_effect_runtime"
              r"\(_impl\);"
          )

          present_matches = list(
              present_pattern.finditer(present_block)
          )

          if len(present_matches) != 3:
              raise RuntimeError(
                  "Expected exactly three "
                  "present_effect_runtime calls, found "
                  + str(len(present_matches))
                  + "."
              )

          d3d12_present = present_matches[2]
          indent = d3d12_present.group("indent")

          present_replacement = (
              indent
              + "reshade::log::message(\n"
              + indent
              + "\treshade::log::level::info,\n"
              + indent
              + "\t\"D3DMetal add-on-core: "
              + "D3D12 effect runtime presentation skipped.\");"
          )

          present_block = (
              present_block[:d3d12_present.start()]
              + present_replacement
              + present_block[d3d12_present.end():]
          )

          source = (
              source[:init_start]
              + init_block
              + reset_block
              + present_block
          )

          path.write_text(
              source,
              encoding="utf-8",
              newline="\n",
          )

          verification = path.read_text(
              encoding="utf-8"
          )

          required_strings = [
              "D3DMetal add-on-core: "
              "D3D12 effect runtime initialization skipped",
              "D3DMetal add-on-core: "
              "D3D12 effect runtime reset skipped",
              "D3DMetal add-on-core: "
              "D3D12 effect runtime presentation skipped",
              "reshade::addon_event::init_swapchain",
              "reshade::addon_event::destroy_swapchain",
              "reshade::addon_event::present",
          ]

          for required in required_strings:
              if required not in verification:
                  raise RuntimeError(
                      "Patch verification failed: "
                      + required
                  )

          remaining_present_calls = verification.count(
              "reshade::present_effect_runtime(_impl);"
          )

          if remaining_present_calls != 2:
              raise RuntimeError(
                  "Expected two remaining effect-runtime "
                  "present calls for D3D10/D3D11, found "
                  + str(remaining_present_calls)
                  + "."
              )

          d3d12_guards = verification.count(
              "_direct3d_version != "
              "reshade::api::device_api::d3d12"
          )

          if d3d12_guards != 2:
              raise RuntimeError(
                  "Expected two D3D12 runtime guards, found "
                  + str(d3d12_guards)
                  + "."
              )

          print("D3DMetal add-on-core patch applied.")
          print("D3D12 effect runtime initialization disabled.")
          print("D3D12 effect runtime reset disabled.")
          print("D3D12 effect runtime presentation disabled.")
          print("D3D10 and D3D11 behavior unchanged.")
          print("ReShade add-on events remain active.")
          '@ | Set-Content `
            -Path patch_d3dmetal_addon_core.py `
            -Encoding utf8

          python patch_d3dmetal_addon_core.py

      - name: Verify patched source
        shell: pwsh
        run: |
          Write-Host "===== ADD-ON CORE MARKERS ====="

          Select-String `
            -Path "source\dxgi\dxgi_swapchain.cpp" `
            -Pattern `
              "D3DMetal add-on-core", `
              "_direct3d_version != reshade::api::device_api::d3d12" `
            -Context 3,3

          Write-Host "===== ADD-ON EVENTS PRESERVED ====="

          Select-String `
            -Path "source\dxgi\dxgi_swapchain.cpp" `
            -Pattern `
              "addon_event::init_swapchain", `
              "addon_event::destroy_swapchain", `
              "addon_event::present" |
            Select-Object -First 30

          Write-Host "===== REMAINING EFFECT PRESENT CALLS ====="

          Select-String `
            -Path "source\dxgi\dxgi_swapchain.cpp" `
            -Pattern "present_effect_runtime"

      - name: Build ReShade solution
        shell: pwsh
        run: |
          msbuild ReShade.sln `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform="64-bit" `
            /m:1 `
            /verbosity:minimal

      - name: Locate built ReShade DLL
        shell: pwsh
        run: |
          $dll = Get-ChildItem `
            -Path . `
            -Filter "ReShade64.dll" `
            -Recurse `
            -File |
            Where-Object {
              $_.FullName -notmatch "\\deps\\"
            } |
            Select-Object -First 1

          if ($null -eq $dll) {
            Write-Host "Candidate ReShade files:"

            Get-ChildItem `
              -Path . `
              -Recurse `
              -File |
              Where-Object {
                $_.Name -like "ReShade*.dll" -or
                $_.Name -like "ReShade*.exe"
              } |
              Select-Object FullName, Length |
              Format-Table -AutoSize

            throw "ReShade64.dll was not produced."
          }

          Write-Host "Built DLL:"
          Write-Host $dll.FullName

          Copy-Item `
            -Path $dll.FullName `
            -Destination "$env:GITHUB_WORKSPACE\ReShade64.dll" `
            -Force

          if (-not (
            Test-Path "$env:GITHUB_WORKSPACE\ReShade64.dll"
          )) {
            throw "Failed to copy ReShade64.dll."
          }

      - name: Create build information
        shell: pwsh
        run: |
          $dll = "$env:GITHUB_WORKSPACE\ReShade64.dll"
          $hash = Get-FileHash $dll -Algorithm SHA256
          $file = Get-Item $dll

          "Build: D3DMetal Addon-Core ReShade" |
            Set-Content build-info.txt

          "Repository: $env:GITHUB_REPOSITORY" |
            Add-Content build-info.txt

          "Commit: $env:GITHUB_SHA" |
            Add-Content build-info.txt

          "Built UTC: $([DateTime]::UtcNow.ToString('o'))" |
            Add-Content build-info.txt

          "Size: $($file.Length) bytes" |
            Add-Content build-info.txt

          "SHA256: $($hash.Hash)" |
            Add-Content build-info.txt

          "Patch: D3D12 effect runtime initialization disabled" |
            Add-Content build-info.txt

          "Patch: D3D12 effect runtime reset disabled" |
            Add-Content build-info.txt

          "Patch: D3D12 effect runtime presentation disabled" |
            Add-Content build-info.txt

          "Patch: ReShade add-on events preserved" |
            Add-Content build-info.txt

          Get-Content build-info.txt

      - name: Upload patched ReShade
        uses: actions/upload-artifact@v4
        with:
          name: reshade-d3dmetal-addon-core-${{ github.sha }}
          path: |
            ReShade64.dll
            build-info.txt
          if-no-files-found: error
          retention-days: 14
