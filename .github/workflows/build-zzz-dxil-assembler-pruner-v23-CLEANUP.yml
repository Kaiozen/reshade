name: Build ZZZ DXIL Assembler Pruner v23 Cleanup Final

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  cleanup:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Download previous V23 artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Path "$PWD\input" -Force | Out-Null

          gh run download 30604112182 --repo "${{ github.repository }}" --name "zzz-dxil-assembler-pruner-v23" --dir "$PWD\input"

          $ir = Get-ChildItem -LiteralPath "$PWD\input" -Recurse -Filter "modified-no-sort.ll" | Select-Object -First 1

          if (-not $ir) {
            throw "modified-no-sort.ll was not found in artifact 30604112182."
          }

          Copy-Item -LiteralPath $ir.FullName -Destination "$PWD\modified-no-sort.ll" -Force

          Write-Host "INPUT_IR=$($ir.FullName)"
          Write-Host "INPUT_IR_SIZE=$((Get-Item -LiteralPath "$PWD\modified-no-sort.ll").Length)"

      - name: Remove orphaned SortRay declarations
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $inputPath = "$PWD\modified-no-sort.ll"
          $outputPath = "$PWD\cleaned-no-sort.ll"

          if (-not (Test-Path -LiteralPath $inputPath)) {
            throw "modified-no-sort.ll is missing."
          }

          $lines = Get-Content -LiteralPath $inputPath

          $typeLine = '%struct.RWByteAddressBuffer = type { i32 }'
          $sortNeedle = '?_RWRaySortBuffer@@3URWByteAddressBuffer@@A'
          $helperNeedle = 'declare %dx.types.Handle @dx.op.createHandleForLib.struct.RWByteAddressBuffer'
          $oldListLine = '!19 = !{!20, !21}'
          $newListLine = '!19 = !{!21}'
          $oldUavPrefix = '!21 = !{i32 1, %"class.RWStructuredBuffer<RayIntersection_Data>"*'
          $newUavPrefix = '!21 = !{i32 0, %"class.RWStructuredBuffer<RayIntersection_Data>"*'

          $typeCount = @($lines | Where-Object { $_ -eq $typeLine }).Count
          $sortReferenceCount = @($lines | Where-Object { $_.Contains($sortNeedle) }).Count
          $helperCount = @($lines | Where-Object { $_.Contains($helperNeedle) }).Count
          $listCount = @($lines | Where-Object { $_ -eq $oldListLine }).Count
          $uavCount = @($lines | Where-Object { $_.StartsWith($oldUavPrefix) }).Count

          if ($typeCount -ne 1) {
            throw "Expected one RWByteAddressBuffer type declaration, found $typeCount."
          }

          if ($sortReferenceCount -ne 2) {
            throw "Expected two RWRaySortBuffer references, found $sortReferenceCount."
          }

          if ($helperCount -ne 1) {
            throw "Expected one RWByteAddressBuffer helper declaration, found $helperCount."
          }

          if ($listCount -ne 1) {
            throw "Expected one UAV metadata list, found $listCount."
          }

          if ($uavCount -ne 1) {
            throw "Expected one surviving UAV metadata entry, found $uavCount."
          }

          $cleaned = [System.Collections.Generic.List[string]]::new()

          foreach ($line in $lines) {
            if ($line -eq $typeLine) {
              continue
            }

            if ($line.Contains($sortNeedle)) {
              continue
            }

            if ($line.Contains($helperNeedle)) {
              continue
            }

            if ($line -eq $oldListLine) {
              $cleaned.Add($newListLine)
              continue
            }

            if ($line.StartsWith($oldUavPrefix)) {
              $cleaned.Add($line.Replace('!21 = !{i32 1, ', '!21 = !{i32 0, '))
              continue
            }

            $cleaned.Add($line)
          }

          [IO.File]::WriteAllLines(
            $outputPath,
            $cleaned,
            [Text.UTF8Encoding]::new($false)
          )

          $verify = Get-Content -LiteralPath $outputPath -Raw

          if ($verify.Contains('%struct.RWByteAddressBuffer')) {
            throw "RWByteAddressBuffer type or reference remains."
          }

          if ($verify.Contains($sortNeedle)) {
            throw "RWRaySortBuffer reference remains."
          }

          if ($verify.Contains('createHandleForLib.struct.RWByteAddressBuffer')) {
            throw "RWByteAddressBuffer helper remains."
          }

          if ($verify.Contains($oldListLine)) {
            throw "Old UAV metadata list remains."
          }

          if (-not $verify.Contains($newListLine)) {
            throw "Cleaned UAV metadata list is missing."
          }

          if (-not $verify.Contains($newUavPrefix)) {
            throw "Surviving UAV resource ID was not normalized."
          }

          Write-Host "ORPHANED_SORTRAY_DECLARATIONS_REMOVED"
          Write-Host "CLEANED_IR_SIZE=$((Get-Item -LiteralPath $outputPath).Length)"

      - name: Download official Microsoft DXC v1.9.2607
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2607/dxc_2026_07_29.zip"

          Invoke-WebRequest -Uri $url -OutFile "$PWD\dxc.zip"

          $zipHash = (Get-FileHash -LiteralPath "$PWD\dxc.zip" -Algorithm SHA256).Hash.ToLowerInvariant()

          if ($zipHash -ne "a1dfb116ba3eeae6a1582291b53a8e7bf65ad760676bd3194685c8f7367cd241") {
            throw "DXC archive SHA256 mismatch: $zipHash"
          }

          Expand-Archive -LiteralPath "$PWD\dxc.zip" -DestinationPath "$PWD\dxc" -Force

          $dxcExe = Get-ChildItem -LiteralPath "$PWD\dxc" -Recurse -Filter "dxc.exe" | Where-Object { $_.FullName -match '\\bin\\x64\\dxc\.exe$' } | Select-Object -First 1

          if (-not $dxcExe) {
            throw "dxc.exe was not found."
          }

          $x64Dir = $dxcExe.DirectoryName
          $binDir = Split-Path -Path $x64Dir -Parent
          $root = Split-Path -Path $binDir -Parent
          $dxvExe = Join-Path -Path $x64Dir -ChildPath "dxv.exe"

          if (-not (Test-Path -LiteralPath $dxvExe)) {
            throw "dxv.exe was not found."
          }

          "DXC_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DXC_EXE=$($dxcExe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DXV_EXE=$dxvExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DXC_X64_DIR=$x64Dir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "DXC_ROOT=$root"
          Write-Host "DXC_EXE=$($dxcExe.FullName)"
          Write-Host "DXV_EXE=$dxvExe"

      - name: Write DXIL assembler source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $cpp = @'
#include <windows.h>
#include <dxcapi.h>
#include <wrl/client.h>

#include <iostream>

using Microsoft::WRL::ComPtr;

static int fail_with_hresult(const char *message, HRESULT hr)
{
    std::cerr
        << message
        << " HRESULT=0x"
        << std::hex
        << std::uppercase
        << static_cast<unsigned long>(hr)
        << std::endl;

    return 1;
}

int wmain(int argc, wchar_t **argv)
{
    if (argc != 3)
    {
        std::wcerr
            << L"Usage: assemble_cleaned.exe input.ll output.dxil"
            << std::endl;

        return 2;
    }

    const HRESULT init =
        CoInitializeEx(nullptr, COINIT_MULTITHREADED);

    const bool should_uninitialize = SUCCEEDED(init);

    if (FAILED(init) && init != RPC_E_CHANGED_MODE)
        return fail_with_hresult("CoInitializeEx failed", init);

    auto finish = [should_uninitialize](int code)
    {
        if (should_uninitialize)
            CoUninitialize();

        return code;
    };

    ComPtr<IDxcLibrary> library;

    HRESULT hr = DxcCreateInstance(
        CLSID_DxcLibrary,
        IID_PPV_ARGS(library.GetAddressOf()));

    if (FAILED(hr))
        return finish(fail_with_hresult("Create IDxcLibrary failed", hr));

    ComPtr<IDxcAssembler> assembler;

    hr = DxcCreateInstance(
        CLSID_DxcAssembler,
        IID_PPV_ARGS(assembler.GetAddressOf()));

    if (FAILED(hr))
        return finish(fail_with_hresult("Create IDxcAssembler failed", hr));

    UINT32 code_page = CP_UTF8;

    ComPtr<IDxcBlobEncoding> input;

    hr = library->CreateBlobFromFile(
        argv[1],
        &code_page,
        input.GetAddressOf());

    if (FAILED(hr))
        return finish(fail_with_hresult("Load input IR failed", hr));

    ComPtr<IDxcOperationResult> result;

    hr = assembler->AssembleToContainer(
        input.Get(),
        result.GetAddressOf());

    if (FAILED(hr))
        return finish(fail_with_hresult("AssembleToContainer failed", hr));

    HRESULT status = E_FAIL;

    hr = result->GetStatus(&status);

    if (FAILED(hr))
        return finish(fail_with_hresult("GetStatus failed", hr));

    if (FAILED(status))
    {
        ComPtr<IDxcBlobEncoding> errors;

        if (SUCCEEDED(result->GetErrorBuffer(errors.GetAddressOf())) &&
            errors &&
            errors->GetBufferPointer() &&
            errors->GetBufferSize() > 0)
        {
            std::cerr.write(
                static_cast<const char *>(errors->GetBufferPointer()),
                static_cast<std::streamsize>(errors->GetBufferSize()));

            std::cerr << std::endl;
        }

        return finish(
            fail_with_hresult(
                "DXIL assembler rejected cleaned IR",
                status));
    }

    ComPtr<IDxcBlob> output;

    hr = result->GetResult(output.GetAddressOf());

    if (FAILED(hr))
        return finish(fail_with_hresult("GetResult failed", hr));

    if (!output ||
        !output->GetBufferPointer() ||
        output->GetBufferSize() == 0)
    {
        std::cerr << "Assembler returned an empty container." << std::endl;
        return finish(1);
    }

    HANDLE file = CreateFileW(
        argv[2],
        GENERIC_WRITE,
        0,
        nullptr,
        CREATE_ALWAYS,
        FILE_ATTRIBUTE_NORMAL,
        nullptr);

    if (file == INVALID_HANDLE_VALUE)
    {
        std::cerr
            << "CreateFileW failed. Win32="
            << GetLastError()
            << std::endl;

        return finish(1);
    }

    const DWORD size =
        static_cast<DWORD>(output->GetBufferSize());

    DWORD written = 0;

    const BOOL write_ok = WriteFile(
        file,
        output->GetBufferPointer(),
        size,
        &written,
        nullptr);

    CloseHandle(file);

    if (!write_ok || written != size)
    {
        std::cerr
            << "WriteFile failed. Win32="
            << GetLastError()
            << " written="
            << written
            << " expected="
            << size
            << std::endl;

        return finish(1);
    }

    std::cout
        << "CLEANED_DXIL_BYTES="
        << output->GetBufferSize()
        << std::endl;

    std::cout
        << "DXIL_CLEANUP_ASSEMBLY_OK"
        << std::endl;

    return finish(0);
}
'@

          [IO.File]::WriteAllText(
            "$PWD\assemble_cleaned.cpp",
            $cpp,
            [Text.UTF8Encoding]::new($false)
          )

          Write-Host "ASSEMBLER_SOURCE_WRITTEN"

      - name: Build DXIL assembler
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /EHsc /W4 /DUNICODE /D_UNICODE /I"%DXC_ROOT%\inc" assemble_cleaned.cpp /Fe:assemble_cleaned.exe /link /LIBPATH:"%DXC_ROOT%\lib\x64" dxcompiler.lib ole32.lib

      - name: Assemble cleaned DXIL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Copy-Item -LiteralPath "$env:DXC_X64_DIR\dxcompiler.dll" -Destination "$PWD\dxcompiler.dll" -Force

          if (Test-Path -LiteralPath "$env:DXC_X64_DIR\dxil.dll") {
            Copy-Item -LiteralPath "$env:DXC_X64_DIR\dxil.dll" -Destination "$PWD\dxil.dll" -Force
          }

          & "$PWD\assemble_cleaned.exe" "$PWD\cleaned-no-sort.ll" "$PWD\execute-plus-miss-cleaned.dxil"

          if ($LASTEXITCODE -ne 0) {
            throw "DXIL assembler failed with exit code $LASTEXITCODE."
          }

          if (-not (Test-Path -LiteralPath "$PWD\execute-plus-miss-cleaned.dxil")) {
            throw "Cleaned DXIL container was not created."
          }

          Write-Host "CLEANED_DXIL_CREATED"

      - name: Validate cleaned DXIL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          New-Item -ItemType Directory -Path "$PWD\report" -Force | Out-Null

          & "$env:DXC_EXE" -dumpbin "$PWD\execute-plus-miss-cleaned.dxil" 1> "$PWD\report\cleaned-dump.txt" 2> "$PWD\report\cleaned-dump-errors.txt"
          $dumpExit = $LASTEXITCODE

          & "$env:DXV_EXE" "$PWD\execute-plus-miss-cleaned.dxil" 1> "$PWD\report\dxv.txt" 2>&1
          $dxvExit = $LASTEXITCODE

          $outputSize = (Get-Item -LiteralPath "$PWD\execute-plus-miss-cleaned.dxil").Length
          $outputHash = (Get-FileHash -LiteralPath "$PWD\execute-plus-miss-cleaned.dxil" -Algorithm SHA256).Hash.ToLowerInvariant()

          $sortCount = @(Select-String -LiteralPath "$PWD\report\cleaned-dump.txt" -Pattern "ExecuteTrace_SortRay" -SimpleMatch).Count
          $executeCount = @(Select-String -LiteralPath "$PWD\report\cleaned-dump.txt" -Pattern "ExecuteTrace" -SimpleMatch).Count
          $missCount = @(Select-String -LiteralPath "$PWD\report\cleaned-dump.txt" -Pattern "Miss" -SimpleMatch).Count

          if (
            $dumpExit -eq 0 -and
            $dxvExit -eq 0 -and
            $sortCount -eq 0 -and
            $executeCount -ge 1 -and
            $missCount -ge 1
          ) {
            $result = "PASS"
          }
          else {
            $result = "FAIL"
          }

          @(
            "DUMP_EXIT=$dumpExit"
            "DXV_EXIT=$dxvExit"
            "OUTPUT_SIZE=$outputSize"
            "OUTPUT_SHA256=$outputHash"
            "EXECUTETRACE_OCCURRENCES=$executeCount"
            "MISS_OCCURRENCES=$missCount"
            "SORTRAY_OCCURRENCES=$sortCount"
            "RESULT=$result"
          ) | Set-Content -LiteralPath "$PWD\report\validation.txt" -Encoding utf8

          Copy-Item -LiteralPath "$PWD\modified-no-sort.ll" -Destination "$PWD\report\modified-no-sort.ll" -Force
          Copy-Item -LiteralPath "$PWD\cleaned-no-sort.ll" -Destination "$PWD\report\cleaned-no-sort.ll" -Force
          Copy-Item -LiteralPath "$PWD\execute-plus-miss-cleaned.dxil" -Destination "$PWD\report\execute-plus-miss-cleaned.dxil" -Force
          Copy-Item -LiteralPath "$PWD\assemble_cleaned.cpp" -Destination "$PWD\report\assemble_cleaned.cpp" -Force

          Get-Content -LiteralPath "$PWD\report\validation.txt"
          Get-Content -LiteralPath "$PWD\report\dxv.txt" -ErrorAction SilentlyContinue

          if ($result -ne "PASS") {
            throw "Microsoft DXIL validation failed."
          }

          Write-Host "DXV_EXIT=0"
          Write-Host "V23_ASSEMBLER_PRUNER_PASS"

      - name: Upload complete cleanup report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zzz-dxil-assembler-pruner-v23-cleanup-final
          path: report
          if-no-files-found: error
