      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download pinned Microsoft DXC v1.9.2607
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2607/dxc_2026_07_29.zip"
          Invoke-WebRequest -Uri $url -OutFile "$PWD\dxc.zip"

          $zipHash = (Get-FileHash -LiteralPath "$PWD\dxc.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($zipHash -ne "a1dfb116ba3eeae6a1582291b53a8e7bf65ad760676bd3194685c8f7367cd241") {
            throw "DXC archive SHA256 mismatch: $zipHash"
          }

          Expand-Archive -LiteralPath "$PWD\dxc.zip" -DestinationPath "$PWD\dxc" -Force
          $dxcExe = Get-ChildItem -LiteralPath "$PWD\dxc" -Recurse -Filter dxc.exe | Where-Object { $_.FullName -match '\\bin\\x64\\dxc\.exe$' } | Select-Object -First 1
          if (-not $dxcExe) {
            throw "dxc.exe not found"
          }

          $x64Dir = $dxcExe.DirectoryName
          $binDir = Split-Path -Path $x64Dir -Parent
          $root = Split-Path -Path $binDir -Parent
          $dxvExe = Join-Path -Path $x64Dir -ChildPath "dxv.exe"
          if (-not (Test-Path -LiteralPath $dxvExe)) {
            throw "dxv.exe not found: $dxvExe"
          }

          Add-Content -LiteralPath $env:GITHUB_ENV -Value "DXC_ROOT=$root"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "DXC_EXE=$($dxcExe.FullName)"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "DXV_EXE=$dxvExe"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "DXC_X64_DIR=$x64Dir"

          @(
            "DXC_ZIP_SHA256=$zipHash"
            "DXC_ROOT=$root"
            "DXC_EXE=$($dxcExe.FullName)"
            "DXV_EXE=$dxvExe"
          ) | Set-Content -LiteralPath "$PWD\report\dxc-toolchain.txt"

      - name: Generate physically isolated IR modules
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          & python "$PWD\single_export_isolator.py" "$PWD\v23\cleaned-no-sort.ll" "$PWD\generated" 1> "$PWD\report\isolation.log" 2>&1
          $code = $LASTEXITCODE
          "ISOLATOR_EXIT=$code" | Set-Content -LiteralPath "$PWD\report\isolation-status.txt"
          Copy-Item -Path "$PWD\generated\*" -Destination "$PWD\report\" -Force -ErrorAction SilentlyContinue
          Write-Host "ISOLATOR_EXIT=$code"

      - name: Build the V23 DXIL assembler
        shell: cmd
        continue-on-error: true
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /EHsc /W4 /DUNICODE /D_UNICODE /I"%DXC_ROOT%\inc" v23\assemble_cleaned.cpp /Fe:assemble_cleaned.exe /link /LIBPATH:"%DXC_ROOT%\lib\x64" dxcompiler.lib ole32.lib 1> report\assembler-build.log 2>&1
          echo ASSEMBLER_BUILD_EXIT=%ERRORLEVEL%> report\assembler-build-status.txt
          exit /b 0

      - name: Assemble both physical single-export modules
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          Copy-Item -LiteralPath "$env:DXC_X64_DIR\dxcompiler.dll" -Destination "$PWD\dxcompiler.dll" -Force
          if (Test-Path -LiteralPath "$env:DXC_X64_DIR\dxil.dll") {
            Copy-Item -LiteralPath "$env:DXC_X64_DIR\dxil.dll" -Destination "$PWD\dxil.dll" -Force
          }

          $executeExit = 127
          $missExit = 127

          if ((Test-Path -LiteralPath "$PWD\assemble_cleaned.exe") -and (Test-Path -LiteralPath "$PWD\generated\execute-trace-only.ll")) {
            & "$PWD\assemble_cleaned.exe" "$PWD\generated\execute-trace-only.ll" "$PWD\generated\execute-trace-only.dxil" 1> "$PWD\report\execute-assemble.log" 2>&1
            $executeExit = $LASTEXITCODE
          } else {
            "Assembler or execute-trace-only.ll missing" | Set-Content -LiteralPath "$PWD\report\execute-assemble.log"
          }

          if ((Test-Path -LiteralPath "$PWD\assemble_cleaned.exe") -and (Test-Path -LiteralPath "$PWD\generated\miss-only.ll")) {
            & "$PWD\assemble_cleaned.exe" "$PWD\generated\miss-only.ll" "$PWD\generated\miss-only.dxil" 1> "$PWD\report\miss-assemble.log" 2>&1
            $missExit = $LASTEXITCODE
          } else {
            "Assembler or miss-only.ll missing" | Set-Content -LiteralPath "$PWD\report\miss-assemble.log"
          }

          @(
            "EXECUTE_ASSEMBLER_EXIT=$executeExit"
            "MISS_ASSEMBLER_EXIT=$missExit"
          ) | Set-Content -LiteralPath "$PWD\report\assembly-status.txt"

          Copy-Item -Path "$PWD\generated\*.dxil" -Destination "$PWD\report\" -Force -ErrorAction SilentlyContinue
          Copy-Item -LiteralPath "$PWD\assemble_cleaned.exe" -Destination "$PWD\report\assemble_cleaned.exe" -Force -ErrorAction SilentlyContinue

      - name: Validate control and isolated modules
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"

          function Test-DxilModule {
            param(
              [Parameter(Mandatory = $true)][string]$Name,
              [Parameter(Mandatory = $true)][string]$Path,
              [Parameter(Mandatory = $true)][bool]$ExpectExecute,
              [Parameter(Mandatory = $true)][bool]$ExpectMiss,
              [string]$ExpectedHash = ""
            )

            $dumpPath = "$PWD\report\$Name-dump.txt"
            $dumpErrorPath = "$PWD\report\$Name-dump-errors.txt"
            $dxvPath = "$PWD\report\$Name-dxv.txt"

            if (-not (Test-Path -LiteralPath $Path)) {
              "MISSING=$Path" | Set-Content -LiteralPath $dumpErrorPath
              "Module missing" | Set-Content -LiteralPath $dxvPath
              return [pscustomobject]@{
                Name = $Name
                Pass = $false
                DumpExit = 127
                DxvExit = 127
                Size = 0
                Hash = "MISSING"
                ExecuteCount = 0
                MissCount = 0
                SortCount = 0
              }
            }

            & "$env:DXC_EXE" -dumpbin $Path 1> $dumpPath 2> $dumpErrorPath
            $dumpExit = $LASTEXITCODE
            & "$env:DXV_EXE" $Path 1> $dxvPath 2>&1
            $dxvExit = $LASTEXITCODE

            $size = (Get-Item -LiteralPath $Path).Length
            $hash = (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLowerInvariant()
            $executeCount = (Select-String -LiteralPath $dumpPath -Pattern "?ExecuteTrace@@YAXXZ" -SimpleMatch -ErrorAction SilentlyContinue).Count
            $missCount = (Select-String -LiteralPath $dumpPath -Pattern "?Miss@@YAXURayIntersection_RT@@@Z" -SimpleMatch -ErrorAction SilentlyContinue).Count
            $sortCount = (Select-String -LiteralPath $dumpPath -Pattern "ExecuteTrace_SortRay" -SimpleMatch -ErrorAction SilentlyContinue).Count

            $pass = $true
            if ($dumpExit -ne 0) { $pass = $false }
            if ($dxvExit -ne 0) { $pass = $false }
            if ($size -le 0) { $pass = $false }
            if ($sortCount -ne 0) { $pass = $false }
            if ($ExpectExecute -and $executeCount -lt 1) { $pass = $false }
            if (-not $ExpectExecute -and $executeCount -ne 0) { $pass = $false }
            if ($ExpectMiss -and $missCount -lt 1) { $pass = $false }
            if (-not $ExpectMiss -and $missCount -ne 0) { $pass = $false }
            if ($ExpectedHash -and $hash -ne $ExpectedHash) { $pass = $false }

            return [pscustomobject]@{
              Name = $Name
              Pass = $pass
              DumpExit = $dumpExit
              DxvExit = $dxvExit
              Size = $size
              Hash = $hash
              ExecuteCount = $executeCount
              MissCount = $missCount
              SortCount = $sortCount
            }
          }

          $control = Test-DxilModule -Name "control-combined" -Path "$PWD\v23\execute-plus-miss-cleaned.dxil" -ExpectExecute $true -ExpectMiss $true -ExpectedHash "a315cdb97c6d21f4e2ecb50e38de733f8a76f1c86ac14f6ac44d42b72a041ba8"
          $execute = Test-DxilModule -Name "execute-trace-only" -Path "$PWD\generated\execute-trace-only.dxil" -ExpectExecute $true -ExpectMiss $false
          $miss = Test-DxilModule -Name "miss-only" -Path "$PWD\generated\miss-only.dxil" -ExpectExecute $false -ExpectMiss $true

          $results = @($control, $execute, $miss)
          $summary = foreach ($result in $results) {
            "NAME=$($result.Name) PASS=$($result.Pass) DUMP_EXIT=$($result.DumpExit) DXV_EXIT=$($result.DxvExit) SIZE=$($result.Size) SHA256=$($result.Hash) EXECUTE_SYMBOLS=$($result.ExecuteCount) MISS_SYMBOLS=$($result.MissCount) SORTRAY_SYMBOLS=$($result.SortCount)"
          }
          $summary | Set-Content -LiteralPath "$PWD\report\validation-summary.txt"
          $summary | ForEach-Object { Write-Host $_ }

          $allPass = ($control.Pass -and $execute.Pass -and $miss.Pass)
          if ($allPass) {
            "PASS" | Set-Content -LiteralPath "$PWD\report\RESULT.txt"
            "V26_SINGLE_EXPORT_ISOLATION_PASS" | Set-Content -LiteralPath "$PWD\report\marker.txt"
            Write-Host "V26_SINGLE_EXPORT_ISOLATION_PASS"
          } else {
            "FAIL" | Set-Content -LiteralPath "$PWD\report\RESULT.txt"
            "V26_SINGLE_EXPORT_ISOLATION_FAIL" | Set-Content -LiteralPath "$PWD\report\marker.txt"
            Write-Host "V26_SINGLE_EXPORT_ISOLATION_FAIL"
          }

      - name: Upload complete V26 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zzz-dxil-single-export-isolator-v26
          path: report
          if-no-files-found: error

      - name: Final V26 result gate
        if: always()
        shell: pwsh
        run: |
          Get-Content -LiteralPath "$PWD\report\validation-summary.txt" -ErrorAction SilentlyContinue
          if (-not (Test-Path -LiteralPath "$PWD\report\RESULT.txt")) {
            throw "V26 result file is missing. Download the artifact for diagnostics."
          }

          $result = (Get-Content -LiteralPath "$PWD\report\RESULT.txt" -Raw).Trim()
          Write-Host "RESULT=$result"
          if ($result -ne "PASS") {
            throw "V26 did not produce two Microsoft-validated physical single-export DXIL modules."
          }

          Write-Host "V26_PHYSICAL_SINGLE_EXPORT_DXIL_READY"
