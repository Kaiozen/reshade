            }
            $size = (Get-Item -LiteralPath $item.Path).Length
            $hash = (Get-FileHash -LiteralPath $item.Path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($size -ne $item.Size) {
              throw "Size mismatch for $($item.Path): $size"
            }
            if ($hash -ne $item.Hash) {
              throw "SHA256 mismatch for $($item.Path): $hash"
            }
            $inputLines += "INPUT=$($item.Path) SIZE=$size SHA256=$hash"
          }

