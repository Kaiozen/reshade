name: Build ReShade D3DMetal RTX Config Sanitizer v9.0 x64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout ReShade and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          ref: 5e1c5d120c5e349578ac7abf633dc745274e23c6

      - name: Force-update submodules
        shell: pwsh
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force
          if (-not (Test-Path "deps\stb\stb_image.h")) {
            throw "ERROR: stb_image.h is missing."
          }
          if (-not (Test-Path "deps\glad\glad\__init__.py")) {
            throw "ERROR: GLAD Python files are missing."
          }
          Write-Host "Submodules are complete."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Show build environment
        shell: pwsh
        run: |
          python --version
          msbuild -version
          git rev-parse HEAD
          git submodule status --recursive

      - name: Patch native D3D12 runtime bridge
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re
          
          ROOT = Path('.')
          
          def read(rel):
              return (ROOT / rel).read_text(encoding='utf-8-sig')
          
          def write(rel, text):
              (ROOT / rel).write_text(text, encoding='utf-8', newline='\n')
          
          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected 1 occurrence, found {count}')
              return text.replace(old, new, 1)
          
          # 1) Native device early return
          rel = 'source/d3d12/d3d12.cpp'
          s = read(rel)
          anchor = "\t// The returned device should alway implement the 'ID3D12Device' base interface"
          insert = (
              "#if RESHADE_ADDON >= 2\n"
              "\t// Balance the temporary add-on-manager reference without constructing a COM proxy.\n"
              "\treshade::unload_addons();\n"
              "#endif\n"
              "\treshade::log::message(\n"
              "\t\treshade::log::level::info,\n"
              "\t\t\"D3DMetal native runtime bridge: returning the original ID3D12Device before all ReShade D3D12Device proxy logic.\");\n"
              "\treturn hr;\n\n" + anchor
          )
          s = replace_once(s, anchor, insert, 'd3d12 early return')
          write(rel, s)
          
          # 2) Private command queue implementation can disable unsupported GPU timestamp queries
          rel = 'source/d3d12/d3d12_impl_command_queue.hpp'
          s = read(rel)
          s = replace_once(
              s,
              'command_queue_impl(device_impl *device, ID3D12CommandQueue *queue);',
              'command_queue_impl(device_impl *device, ID3D12CommandQueue *queue, bool disable_timestamp_queries = false);',
              'queue constructor declaration')
          s = replace_once(
              s,
              '\t\tcom_ptr<ID3D12Fence> _wait_idle_fence;\n',
              '\t\tcom_ptr<ID3D12Fence> _wait_idle_fence;\n\n\t\tconst bool _disable_timestamp_queries;\n',
              'queue timestamp member')
          write(rel, s)
          
          rel = 'source/d3d12/d3d12_impl_command_queue.cpp'
          s = read(rel)
          s = replace_once(
              s,
              'reshade::d3d12::command_queue_impl::command_queue_impl(device_impl *device, ID3D12CommandQueue *queue) :\n\tapi_object_impl(queue),\n\t_device(device)',
              'reshade::d3d12::command_queue_impl::command_queue_impl(device_impl *device, ID3D12CommandQueue *queue, bool disable_timestamp_queries) :\n\tapi_object_impl(queue),\n\t_device(device),\n\t_disable_timestamp_queries(disable_timestamp_queries)',
              'queue constructor definition')
          s = replace_once(
              s,
              '{\n\t// Register queue to device',
              '{\n\tif (_disable_timestamp_queries)\n\t\tlog::message(log::level::info, "D3DMetal native runtime bridge: GPU timestamp queries disabled for the private ReShade command queue.");\n\n\t// Register queue to device',
              'queue marker')
          s = replace_once(
              s,
              'uint64_t reshade::d3d12::command_queue_impl::get_timestamp_frequency() const\n{\n\tUINT64 frequency;',
              'uint64_t reshade::d3d12::command_queue_impl::get_timestamp_frequency() const\n{\n\tif (_disable_timestamp_queries)\n\t\treturn 0;\n\n\tUINT64 frequency;',
              'queue timestamp bypass')
          write(rel, s)
          
          # 3) Avoid allocating timestamp query heaps when frequency is disabled
          rel = 'source/runtime.cpp'
          s = read(rel)
          s = replace_once(
              s,
              '\tif (permutation_index == 0 &&\n\t\t!_device->create_query_heap(api::query_type::timestamp,',
              '\tif (permutation_index == 0 && _timestamp_frequency != 0 &&\n\t\t!_device->create_query_heap(api::query_type::timestamp,',
              'runtime query heap guard')
          write(rel, s)
          
          # 4) Disable the built-in Generic Depth present callback for this native sidecar bridge.
          # Symbolication of ZZZ crash RVA 0x2F0FD resolved to generic_depth_addon.obj!on_present+0x5D,
          # where the callback dereferenced a null object returned by the native D3DMetal path.
          # Color-only ReShade effects remain available; depth-dependent effects are intentionally unavailable.
          rel = 'examples/09-depth/generic_depth_addon.cpp'
          if not (ROOT / rel).is_file():
              raise RuntimeError(f'Generic Depth source was not found at the verified project path: {rel}')
          print(f'GENERIC_DEPTH_SOURCE={rel}')
          s = read(rel)
          pattern = re.compile(r'(?ms)^(?:static\s+)?void\s+on_present\s*\([^;{}]*\)\s*\{')
          matches = list(pattern.finditer(s))
          if len(matches) != 1:
              raise RuntimeError(f'generic depth on_present: expected 1 definition, found {len(matches)}')
          m = matches[0]
          injected = (
              m.group(0) +
              '\n\tstatic bool d3dmetal_depth_safe_marker_logged = false;'
              '\n\tif (!d3dmetal_depth_safe_marker_logged)'
              '\n\t{'
              '\n\t\treshade::log::message('
              '\n\t\t\treshade::log::level::info,'
              '\n\t\t\t"D3DMetal depth-safe bridge: Generic Depth present callback disabled after null-object symbolication.");'
              '\n\t\td3dmetal_depth_safe_marker_logged = true;'
              '\n\t}'
              '\n\treturn;'
          )
          s = s[:m.start()] + injected + s[m.end():]
          write(rel, s)

          # 5) Add a DXGI swap-chain constructor backed by private non-COM D3D12 implementation objects
          rel = 'source/dxgi/dxgi_swapchain.hpp'
          s = read(rel)
          s = replace_once(
              s,
              'class D3D12CommandQueue;\nnamespace reshade::api { enum class device_api; struct swapchain; }',
              'class D3D12CommandQueue;\nstruct ID3D12Device;\nstruct ID3D12CommandQueue;\nnamespace reshade::api { enum class device_api; struct swapchain; }\nnamespace reshade::d3d12 { class device_impl; class command_queue_impl; }',
              'header forward declarations')
          s = replace_once(
              s,
              '\tDXGISwapChain(IDXGIFactory *factory, D3D12CommandQueue *command_queue, IDXGISwapChain3 *original);\n',
              '\tDXGISwapChain(IDXGIFactory *factory, D3D12CommandQueue *command_queue, IDXGISwapChain3 *original);\n\tDXGISwapChain(IDXGIFactory *factory, ID3D12Device *device, ID3D12CommandQueue *command_queue, IDXGISwapChain3 *original);\n',
              'native bridge constructor declaration')
          s = replace_once(
              s,
              '\tconst reshade::api::device_api _direct3d_version;\n\n\tIDXGIFactory *const _parent_factory;',
              '\tconst reshade::api::device_api _direct3d_version;\n\n\t// Private implementation objects used only by ReShade. These are never returned through COM.\n\treshade::d3d12::device_impl *const _owned_d3d12_device_impl;\n\treshade::d3d12::command_queue_impl *const _owned_d3d12_command_queue_impl;\n\treshade::d3d12::command_queue_impl *const _direct3d_command_queue_impl;\n\n\tIDXGIFactory *const _parent_factory;',
              'bridge members')
          write(rel, s)
          
          rel = 'source/dxgi/dxgi_swapchain.cpp'
          s = read(rel)
          # Add member initializers to D3D10, D3D11, D3D12 constructors
          s = replace_once(
              s,
              '\t_direct3d_version(reshade::api::device_api::d3d10),\n\t_parent_factory(factory),',
              '\t_direct3d_version(reshade::api::device_api::d3d10),\n\t_owned_d3d12_device_impl(nullptr),\n\t_owned_d3d12_command_queue_impl(nullptr),\n\t_direct3d_command_queue_impl(nullptr),\n\t_parent_factory(factory),',
              'd3d10 member initializers')
          s = replace_once(
              s,
              '\t_direct3d_version(reshade::api::device_api::d3d11),\n\t_parent_factory(factory),',
              '\t_direct3d_version(reshade::api::device_api::d3d11),\n\t_owned_d3d12_device_impl(nullptr),\n\t_owned_d3d12_command_queue_impl(nullptr),\n\t_direct3d_command_queue_impl(nullptr),\n\t_parent_factory(factory),',
              'd3d11 member initializers')
          s = replace_once(
              s,
              '\t_direct3d_version(reshade::api::device_api::d3d12),\n\t_parent_factory(factory),\n\t_impl(new reshade::d3d12::swapchain_impl(command_queue->_device, original))',
              '\t_direct3d_version(reshade::api::device_api::d3d12),\n\t_owned_d3d12_device_impl(nullptr),\n\t_owned_d3d12_command_queue_impl(nullptr),\n\t_direct3d_command_queue_impl(command_queue),\n\t_parent_factory(factory),\n\t_impl(new reshade::d3d12::swapchain_impl(command_queue->_device, original))',
              'proxy d3d12 member initializers')
          s = replace_once(
              s,
              '\treshade::create_effect_runtime(_impl, command_queue);\n\ton_init(false);\n}\nDXGISwapChain::~DXGISwapChain()',
              '\treshade::create_effect_runtime(_impl, _direct3d_command_queue_impl);\n\ton_init(false);\n}\nDXGISwapChain::DXGISwapChain(IDXGIFactory *factory, ID3D12Device *device, ID3D12CommandQueue *command_queue, IDXGISwapChain3 *original) :\n\t_orig(original),\n\t_interface_version(3),\n\t_direct3d_device(device),\n\t_direct3d_command_queue(command_queue),\n\t_direct3d_version(reshade::api::device_api::d3d12),\n\t_owned_d3d12_device_impl(new reshade::d3d12::device_impl(device)),\n\t_owned_d3d12_command_queue_impl(new reshade::d3d12::command_queue_impl(_owned_d3d12_device_impl, command_queue, true)),\n\t_direct3d_command_queue_impl(_owned_d3d12_command_queue_impl),\n\t_parent_factory(factory),\n\t_impl(new reshade::d3d12::swapchain_impl(_owned_d3d12_device_impl, original))\n{\n\tassert(_orig != nullptr && _direct3d_device != nullptr && _direct3d_command_queue != nullptr && _direct3d_command_queue_impl != nullptr && _parent_factory != nullptr);\n\t_parent_factory->AddRef();\n\t_direct3d_device->AddRef();\n\t_direct3d_command_queue->AddRef();\n\n\tfor (size_t i = 0; i < std::size(_direct3d_command_queue_per_back_buffer); ++i)\n\t\t_direct3d_command_queue_per_back_buffer[i] = _direct3d_command_queue;\n\n\tDXGISwapChain *const swapchain_proxy = this;\n\t_orig->SetPrivateData(__uuidof(DXGISwapChain), sizeof(swapchain_proxy), &swapchain_proxy);\n\n\treshade::log::message(reshade::log::level::info, "D3DMetal native runtime bridge: ReShade runtime is hosted by private non-COM D3D12 implementation objects.");\n\treshade::create_effect_runtime(_impl, _direct3d_command_queue_impl);\n\ton_init(false);\n}\nDXGISwapChain::~DXGISwapChain()',
              'native bridge constructor definition')
          s = replace_once(
              s,
              '\tcase reshade::api::device_api::d3d12:\n\t\tdelete static_cast<reshade::d3d12::swapchain_impl *>(_impl);\n\t\tbreak;\n\t}\n\n\t// Release the explicit reference',
              '\tcase reshade::api::device_api::d3d12:\n\t\tdelete static_cast<reshade::d3d12::swapchain_impl *>(_impl);\n\t\tbreak;\n\t}\n\n\t// The queue implementation unregisters itself from the device implementation, so destroy in this order.\n\tdelete _owned_d3d12_command_queue_impl;\n\tdelete _owned_d3d12_device_impl;\n\n\t// Release the explicit reference',
              'bridge destruction')
          # Replace all assumptions that the queue implementation is also a COM proxy
          s = s.replace('static_cast<D3D12CommandQueue *>(_direct3d_command_queue)->_mutex', '_direct3d_command_queue_impl->_mutex')
          s = s.replace('static_cast<D3D12CommandQueue *>(_direct3d_command_queue)->flush_immediate_command_list();', '_direct3d_command_queue_impl->flush_immediate_command_list();')
          s = s.replace('static_cast<D3D12CommandQueue *>(_direct3d_command_queue),\n\t\t\t_impl,', '_direct3d_command_queue_impl,\n\t\t\t_impl,')
          s = s.replace('static_cast<D3D12CommandQueue *>(_direct3d_command_queue), _impl);', '_direct3d_command_queue_impl, _impl);')
          if 'static_cast<D3D12CommandQueue *>(_direct3d_command_queue)' in s:
              raise RuntimeError('unconverted D3D12 command queue proxy cast remains')
          write(rel, s)
          
          # 6) When a native D3D12 queue creates a swap chain, build the private runtime bridge
          rel = 'source/dxgi/dxgi.cpp'
          s = read(rel)
          signature_old = "static void init_swapchain_proxy(IDXGIFactory *factory, reshade::api::device_api direct3d_version, const com_ptr<IUnknown> &device_proxy, T *&swapchain, DXGI_USAGE usage, [[maybe_unused]] UINT sync_interval, [[maybe_unused]] DXGI_SWAP_CHAIN_DESC orig_desc, [[maybe_unused]] bool desc_modified)"
          signature_new = "static void init_swapchain_proxy(IDXGIFactory *factory, reshade::api::device_api direct3d_version, const com_ptr<IUnknown> &device_proxy, IUnknown *native_device_object, T *&swapchain, DXGI_USAGE usage, [[maybe_unused]] UINT sync_interval, [[maybe_unused]] DXGI_SWAP_CHAIN_DESC orig_desc, [[maybe_unused]] bool desc_modified)"
          s = replace_once(s, signature_old, signature_new, 'native bridge init signature')
          call_old = 'init_swapchain_proxy(pFactory, direct3d_version, device_proxy, *ppSwapChain'
          call_new = 'init_swapchain_proxy(pFactory, direct3d_version, device_proxy, pDevice, *ppSwapChain'
          call_count = s.count(call_old)
          if call_count != 4:
              raise RuntimeError(f'native bridge init calls: expected 4 occurrences, found {call_count}')
          s = s.replace(call_old, call_new)
          old = '''\telse\n\t{\n\t\treshade::log::message(reshade::log::level::warning, "Skipping swap chain because it was created without a proxy Direct3D device.");\n\t}\n'''
          new = '''\telse if (com_ptr<ID3D12CommandQueue> native_command_queue;\n\t\tnative_device_object != nullptr && SUCCEEDED(native_device_object->QueryInterface(&native_command_queue)))\n\t{\n\t\tcom_ptr<ID3D12Device> native_device;\n\t\tcom_ptr<IDXGISwapChain3> swapchain3;\n\t\tif (SUCCEEDED(native_command_queue->GetDevice(IID_PPV_ARGS(&native_device))) &&\n\t\t\tSUCCEEDED(swapchain->QueryInterface(&swapchain3)))\n\t\t{\n\t\t\treshade::log::message(reshade::log::level::info, "D3DMetal native runtime bridge: captured native ID3D12Device and ID3D12CommandQueue at DXGI swap-chain creation.");\n\t\t\tswapchain_proxy = new DXGISwapChain(factory, native_device.get(), native_command_queue.get(), swapchain3.get());\n\t\t}\n\t\telse\n\t\t{\n\t\t\treshade::log::message(reshade::log::level::warning, "D3DMetal native runtime bridge: native D3D12 objects were found, but the bridge could not initialize.");\n\t\t}\n\t}\n\telse\n\t{\n\t\treshade::log::message(reshade::log::level::warning, "Skipping swap chain because it was created without a proxy Direct3D device.");\n\t}\n'''
          s = replace_once(s, old, new, 'native bridge init path')
          write(rel, s)
          
          # Verification
          checks = {
              'source/d3d12/d3d12.cpp': [
                  'D3DMetal native runtime bridge: returning the original ID3D12Device',
                  'return hr;',
                  'new D3D12Device',
              ],
              'source/dxgi/dxgi.cpp': [
                  'IUnknown *native_device_object',
                  'native_device_object != nullptr && SUCCEEDED(native_device_object->QueryInterface(&native_command_queue))',
                  'captured native ID3D12Device and ID3D12CommandQueue',
                  'new DXGISwapChain(factory, native_device.get(), native_command_queue.get(), swapchain3.get())',
              ],
              'source/dxgi/dxgi_swapchain.cpp': [
                  'private non-COM D3D12 implementation objects',
                  'new reshade::d3d12::device_impl(device)',
                  'new reshade::d3d12::command_queue_impl(_owned_d3d12_device_impl, command_queue, true)',
                  'reshade::create_effect_runtime(_impl, _direct3d_command_queue_impl);',
                  '_direct3d_command_queue_impl->flush_immediate_command_list();',
              ],
              'source/d3d12/d3d12_impl_command_queue.cpp': [
                  'GPU timestamp queries disabled',
                  'if (_disable_timestamp_queries)',
              ],
              'examples/09-depth/generic_depth_addon.cpp': [
                  'D3DMetal depth-safe bridge: Generic Depth present callback disabled after null-object symbolication.',
                  'd3dmetal_depth_safe_marker_logged',
                  '\n\treturn;',
              ],
          }
          for rel, strings in checks.items():
              text = read(rel)
              for item in strings:
                  if item not in text:
                      raise RuntimeError(f'missing verification marker in {rel}: {item}')
          
          entry = read('source/d3d12/d3d12.cpp')
          if not (entry.find('returning the original ID3D12Device') < entry.find('return hr;', entry.find('returning the original ID3D12Device')) < entry.find('new D3D12Device')):
              raise RuntimeError('native device early return ordering failed')
          
          dxgi = read('source/dxgi/dxgi.cpp')
          if dxgi.count('init_swapchain_proxy(pFactory, direct3d_version, device_proxy, pDevice, *ppSwapChain') != 4:
              raise RuntimeError('native device object was not forwarded to all swap-chain initialization paths')
          if 'SUCCEEDED(device->QueryInterface(&native_command_queue))' in dxgi:
              raise RuntimeError('stale undeclared device identifier remains in native bridge path')

          print('PATCH_OK')
          '@ | Set-Content `
            -Path patch_native_runtime_bridge.py `
            -Encoding utf8
          python patch_native_runtime_bridge.py

      - name: Add native CreateStateObject descriptor trace
        shell: pwsh
        run: |
          $encoded = @'
          ZnJvbSBwYXRobGliIGltcG9ydCBQYXRoCgpwYXRoID0gUGF0aCgnc291cmNlL2QzZDEyL2QzZDEyLmNwcCcpCnRleHQgPSBwYXRoLnJlYWRfdGV4dChlbmNv
          ZGluZz0ndXRmLTgtc2lnJykKCmluY2x1ZGVfYW5jaG9yID0gJyNpbmNsdWRlICJhZGRvbl9tYW5hZ2VyLmhwcCJcbicKaW5jbHVkZXMgPSAnJycjaW5jbHVk
          ZSAiYWRkb25fbWFuYWdlci5ocHAiCiNpbmNsdWRlIDxhdG9taWM+CiNpbmNsdWRlIDxtdXRleD4KI2luY2x1ZGUgPGNzdGRpbnQ+CicnJwppZiB0ZXh0LmNv
          dW50KGluY2x1ZGVfYW5jaG9yKSAhPSAxOgogICAgcmFpc2UgUnVudGltZUVycm9yKCdpbmNsdWRlIGFuY2hvciBjb3VudCBtaXNtYXRjaCcpCnRleHQgPSB0
