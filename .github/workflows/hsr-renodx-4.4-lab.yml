name: HSR RenoDX 4.4 Lab

on:
  push:
    branches:
      - hsr-renodx-4.4-lab
    paths:
      - ".github/workflows/hsr-renodx-4.4-lab.yml"
      - ".github/hsr-renodx/**"

permissions:
  contents: read

env:
  RESHADE_REF: v6.8.0
  RESHADE_SHA: 18deaa52de0c425a78b329e9cb3c497281cd00ec
  RENODX_REF: ee9ddee35e125e95e5fd242c1431b2a253cc9068

jobs:
  reshade:
    name: ReShade DX11 full-addon
    runs-on: windows-2022
    steps:
      - name: Checkout lab control files
        uses: actions/checkout@v4

      - name: Checkout pinned ReShade
        uses: actions/checkout@v4
        with:
          repository: crosire/reshade
          ref: ${{ env.RESHADE_REF }}
          path: reshade
          submodules: recursive

      - name: Verify ReShade pin
        shell: pwsh
        run: |
          $actual = (git -C reshade rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -ne $env:RESHADE_SHA.ToLowerInvariant()) {
            throw "Unexpected ReShade commit: $actual"
          }
          "RESHADE_PIN=PASS"

      - name: Apply ReShade DX11 D3DMetal empty-SRV HOTFIX N
        shell: pwsh
        run: |
          python .github\hsr-renodx\patch_reshade_empty_srv.py `
            reshade\source\runtime.cpp
          if ($LASTEXITCODE -ne 0) {
            throw "HOTFIX N ReShade empty-SRV patch failed."
          }

      - name: Apply ReShade HSR minimal-core HDR HOTFIX R3
        shell: pwsh
        run: |
          python .github\hsr-renodx\patch_reshade_core_final_hdr.py `
            reshade\source\runtime.cpp `
            reshade\res\shaders\copy_ps.hlsl
          if ($LASTEXITCODE -ne 0) {
            throw "HOTFIX R3 minimal-core HDR patch failed."
          }


      - name: Apply ReShade HSR SRV-only intermediate HOTFIX T
        shell: pwsh
        run: |
          python .github\hsr-renodx\patch_reshade_srv_only_intermediate.py `
            reshade\source\runtime.cpp
          if ($LASTEXITCODE -ne 0) {
            throw "HOTFIX T SRV-only intermediate patch failed."
          }

      - name: Apply ReShade D3D11 View1 fallback HOTFIX U
        shell: pwsh
        run: |
          python .github\hsr-renodx\patch_d3d11_view1_fallback.py `
            reshade\source\d3d11\d3d11_impl_device.cpp
          if ($LASTEXITCODE -ne 0) {
            throw "HOTFIX U D3D11 View1 fallback patch failed."
          }

      - name: Apply ReShade HSR atomic native-Present HDR HOTFIX S
        shell: pwsh
        run: |
          python .github\hsr-renodx\patch_reshade_atomic_present_hdr.py `
            reshade\source\runtime.cpp `
            reshade\source\dxgi\dxgi_swapchain.cpp
          if ($LASTEXITCODE -ne 0) {
            throw "HOTFIX S atomic native-Present HDR patch failed."
          }

      - name: Apply ReShade HSR minimal reset symmetry HOTFIX V
        shell: pwsh
        run: |
          python .github\hsr-renodx\patch_reshade_minimal_reset_symmetry.py `
            reshade\source\runtime.cpp
          if ($LASTEXITCODE -ne 0) {
            throw "HOTFIX V minimal reset symmetry patch failed."
          }

      - name: Configure MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Build ReShade x64 Release
        shell: pwsh
        run: |
          msbuild reshade\ReShade.sln `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=64-bit `
            /m:1 `
            /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { throw "ReShade build failed." }

      - name: Package ReShade payload
        shell: pwsh
        run: |
          $dll = Get-ChildItem reshade -Recurse -File -Filter ReShade64.dll |
            Where-Object { $_.FullName -notmatch "\\deps\\" } |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if (-not $dll) { throw "ReShade64.dll was not produced." }

          $exports = dumpbin /exports $dll.FullName | Out-String
          if ($exports -notmatch "ReShadeRegisterAddon") {
            throw "Built ReShade does not expose ReShadeRegisterAddon."
          }

          New-Item -ItemType Directory -Force payload-reshade | Out-Null
          Copy-Item $dll.FullName payload-reshade\ReShade64.dll -Force
          $license = Get-ChildItem reshade -File | Where-Object { $_.Name -match '^LICENSE' } | Select-Object -First 1
          if ($license) { Copy-Item $license.FullName payload-reshade\ReShade-LICENSE.txt -Force }
          $hash = (Get-FileHash payload-reshade\ReShade64.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "KAIOZEN_HSR_RENODX_LAB_PAYLOAD=1",
            "COMPONENT=ReShade64.dll",
            "SOURCE=crosire/reshade",
            "REF=$env:RESHADE_REF",
            "COMMIT=$env:RESHADE_SHA",
            "CONFIGURATION=Release|64-bit",
            "FULL_ADDON_EXPORT=ReShadeRegisterAddon",
            "PATCH=KAIOZEN_HSR_RESHADE_EMPTY_SRV_RGBA8_N",
            "PATCH2=KAIOZEN_HSR_MINIMAL_CORE_HDR_R3",
            "PATCH3=KAIOZEN_HSR_ATOMIC_NATIVE_PRESENT_HDR_S",
            "PATCH4=KAIOZEN_HSR_SRV_ONLY_INTERMEDIATE_T",
            "PATCH5=KAIOZEN_D3D11_VIEW1_LEGACY_FALLBACK_U",
            "PATCH6=KAIOZEN_HSR_MINIMAL_RESET_SYMMETRY_V",
            "PATCH7=KAIOZEN_HSR_ORIGINAL_SATURATION_W2",
            "SHA256=$hash"
          ) | Set-Content payload-reshade\manifest.txt -Encoding ascii
          Get-Content payload-reshade\manifest.txt

      - name: Upload ReShade payload
        uses: actions/upload-artifact@v4
        with:
          name: hsr-reshade-dx11-full-addon
          path: payload-reshade
          if-no-files-found: error
          retention-days: 14

  renodx:
    name: RenoDX ${{ matrix.variant }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        variant: [register-only, shader-only, full-upstream]
    steps:
      - name: Checkout lab control files
        uses: actions/checkout@v4

      - name: Checkout pinned RenoDX
        uses: actions/checkout@v4
        with:
          repository: clshortfuse/renodx
          ref: ${{ env.RENODX_REF }}
          path: renodx
          submodules: recursive

      - name: Verify RenoDX pin
        shell: pwsh
        run: |
          $actual = (git -C renodx rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -ne $env:RENODX_REF.ToLowerInvariant()) {
            throw "Unexpected RenoDX commit: $actual"
          }
          "RENODX_PIN=PASS"

      - name: Apply isolation variant
        if: matrix.variant != 'full-upstream'
        shell: pwsh
        run: |
          python .github\hsr-renodx\patch_hsr_variant.py `
            --file renodx\src\games\honkai-starrail\addon.cpp `
            --variant "${{ matrix.variant }}"
          if ($LASTEXITCODE -ne 0) { throw "Variant patch failed." }

      - name: Apply full-upstream HOTFIX L - RenoDX Apple PQ HDR
        if: matrix.variant == 'full-upstream'
        shell: pwsh
        run: |
          python .github\hsr-renodx\patch_hsr_variant.py `
            --file renodx\src\games\honkai-starrail\addon.cpp `
            --variant "direct-rgba8-pq"
          if ($LASTEXITCODE -ne 0) {
            throw "HOTFIX J direct-RGBA8-PQ patch failed."
          }

      - name: Set up RenoDX shader tools
        shell: pwsh
        working-directory: renodx
        run: |
          .\scripts\setup-dev-env.ps1 -Update -Tools dxc,slang,glslang

      - name: Configure MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Configure RenoDX
        shell: pwsh
        working-directory: renodx
        run: cmake --preset vs-x64

      - name: Build HSR RenoDX target
        shell: pwsh
        working-directory: renodx
        run: cmake --build --preset vs-x64-release --target honkai-starrail --verbose

      - name: Package HSR RenoDX variant
        shell: pwsh
        run: |
          $addon = Get-ChildItem renodx -Recurse -File -Filter renodx-honkai-starrail.addon64 |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if (-not $addon) { throw "renodx-honkai-starrail.addon64 was not produced." }

          $variant = "${{ matrix.variant }}"
          $outName = switch ($variant) {
            "register-only" { "renodx-hsr-register-only.addon64" }
            "shader-only"   { "renodx-hsr-shader-only.addon64" }
            default          { "renodx-hsr-full-upstream.addon64" }
          }
          $dir = "payload-renodx-$variant"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item $addon.FullName (Join-Path $dir $outName) -Force

          $bytes = [IO.File]::ReadAllBytes((Join-Path $dir $outName))
          $ascii = [Text.Encoding]::ASCII.GetString($bytes)
          if ($ascii -notmatch "RenoDX") { throw "Built add-on is missing RenoDX marker." }
          if ($variant -eq "register-only" -and $ascii -notmatch "KAIOZEN_HSR_44_REGISTER_ONLY") {
            throw "Register-only binary marker missing."
          }
          if ($variant -eq "shader-only" -and $ascii -notmatch "KAIOZEN_HSR_44_SHADER_ONLY") {
            throw "Shader-only binary marker missing."
          }

          if ($variant -eq "full-upstream" -and $ascii -notmatch "KAIOZEN_HSR_44_RGBA8_PQ_HOTFIX_L") {
            throw "HOTFIX L binary marker missing."
          }

          $license = Get-ChildItem renodx -File | Where-Object { $_.Name -match '^LICENSE' } | Select-Object -First 1
          if ($license) { Copy-Item $license.FullName (Join-Path $dir RenoDX-LICENSE.txt) -Force }
          $hash = (Get-FileHash (Join-Path $dir $outName) -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "KAIOZEN_HSR_RENODX_LAB_PAYLOAD=1",
            "COMPONENT=$outName",
            "VARIANT=$variant",
            "SOURCE=clshortfuse/renodx",
            "COMMIT=$env:RENODX_REF",
            "HSR_SOURCE_FOLDER=src/games/honkai-starrail",
            "SHA256=$hash"
          ) | Set-Content (Join-Path $dir manifest.txt) -Encoding ascii
          Get-Content (Join-Path $dir manifest.txt)

      - name: Upload HSR RenoDX variant
        uses: actions/upload-artifact@v4
        with:
          name: hsr-renodx-${{ matrix.variant }}
          path: payload-renodx-${{ matrix.variant }}
          if-no-files-found: error
          retention-days: 14

  devkit:
    name: RenoDX DevKit
    runs-on: windows-2022
    steps:
      - name: Checkout pinned RenoDX
        uses: actions/checkout@v4
        with:
          repository: clshortfuse/renodx
          ref: ${{ env.RENODX_REF }}
          path: renodx
          submodules: recursive

      - name: Verify RenoDX pin
        shell: pwsh
        run: |
          $actual = (git -C renodx rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -ne $env:RENODX_REF.ToLowerInvariant()) { throw "Unexpected RenoDX commit: $actual" }

      - name: Set up RenoDX shader tools
        shell: pwsh
        working-directory: renodx
        run: .\scripts\setup-dev-env.ps1 -Update -Tools dxc,slang,glslang

      - name: Configure MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Configure RenoDX
        shell: pwsh
        working-directory: renodx
        run: cmake --preset vs-x64

      - name: Build DevKit and MCP bridge
        shell: pwsh
        working-directory: renodx
        run: cmake --build --preset vs-x64-release --target devkit mcp_bridge --verbose

      - name: Package DevKit payload
        shell: pwsh
        run: |
          $devkit = Get-ChildItem renodx -Recurse -File -Filter renodx-devkit.addon64 |
            Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          $bridge = Get-ChildItem renodx -Recurse -File -Filter renodx-mcp-bridge.exe |
            Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if (-not $devkit) { throw "renodx-devkit.addon64 was not produced." }
          if (-not $bridge) { throw "renodx-mcp-bridge.exe was not produced." }

          New-Item -ItemType Directory -Force payload-devkit | Out-Null
          Copy-Item $devkit.FullName payload-devkit\renodx-devkit.addon64 -Force
          Copy-Item $bridge.FullName payload-devkit\renodx-mcp-bridge.exe -Force
          $license = Get-ChildItem renodx -File | Where-Object { $_.Name -match '^LICENSE' } | Select-Object -First 1
          if ($license) { Copy-Item $license.FullName payload-devkit\RenoDX-LICENSE.txt -Force }
          $devkitHash = (Get-FileHash payload-devkit\renodx-devkit.addon64 -Algorithm SHA256).Hash.ToLowerInvariant()
          $bridgeHash = (Get-FileHash payload-devkit\renodx-mcp-bridge.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "KAIOZEN_HSR_RENODX_LAB_PAYLOAD=1",
            "COMPONENT=RenoDX DevKit",
            "SOURCE=clshortfuse/renodx",
            "COMMIT=$env:RENODX_REF",
            "DEVKIT_SHA256=$devkitHash",
            "MCP_BRIDGE_SHA256=$bridgeHash"
          ) | Set-Content payload-devkit\manifest.txt -Encoding ascii

      - name: Upload DevKit payload
        uses: actions/upload-artifact@v4
        with:
          name: hsr-renodx-devkit
          path: payload-devkit
          if-no-files-found: error
          retention-days: 14
