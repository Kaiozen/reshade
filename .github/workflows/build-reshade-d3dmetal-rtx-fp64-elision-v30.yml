            "a315cdb97c6d21f4e2ecb50e38de733f8a76f1c86ac14f6ac44d42b72a041ba8"
          )

          foreach ($marker in $required) {
            if (-not (
              $ascii.Contains($marker) -or
              $utf16.Contains($marker)
            )) {
              throw "V24 binary marker missing: $marker"
            }
          }

          $peOffset = [BitConverter]::ToInt32(
            $bytes,
            0x3C
          )

          $machine = [BitConverter]::ToUInt16(
            $bytes,
            $peOffset + 4
          )

          if ($machine -ne 0x8664) {
            throw (
              "Built DLL is not x86-64 PE. Machine=0x{0:X4}" `
              -f $machine
            )
          }

          Write-Host (
            "V25 binary verification passed. Machine=0x{0:X4}" `
            -f $machine
          )

