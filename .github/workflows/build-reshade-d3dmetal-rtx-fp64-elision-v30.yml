      - name: Patch semantic full-state isolator v17.1
        shell: pwsh
        run: |
          $patch = @'
          from pathlib import Path

          path = Path("source/d3d12/d3d12.cpp")
          text = path.read_text(encoding="utf-8-sig")

          function_anchor = "\n\tbool create_parent_seed_pipeline_v16(\n"

          if text.count(function_anchor) != 1:
              raise RuntimeError(
                  "v17.1 function anchor count was "
                  f"{text.count(function_anchor)}, expected 1"
              )

          helper = r"""
          	static bool s_v171_semantic_target_consumed = false;
          """

          text = text.replace(
              function_anchor,
              helper + function_anchor,
              1
          )

          function_position = text.index(function_anchor)

          init_anchor = (
              "\t{\n"
              "\t\t*retry_object = nullptr;\n"
              "\t\tretry_hr = E_FAIL;\n"
              "\t\tflattened_subobjects = 0;\n"
              "\t\tpruned_subobjects = 0;\n"
          )

          init_position = text.find(
              init_anchor,
              function_position
          )

          if init_position < 0:
              raise RuntimeError(
                  "v17.1 initialization anchor was not found"
              )

          gate = r"""

          		unsigned int v171_child_count = 0;

          		for (const bool selected_child : selected_children)
          		{
          			if (selected_child)
          				++v171_child_count;
          		}

          		const bool v171_full_child_set =
          			!selected_children.empty() &&
          			v171_child_count ==
          				static_cast<unsigned int>(
          					selected_children.size());

          		const bool v171_semantic_target =
          			strategy_index == 10u &&
          			flags_index == 0u &&
          			v171_full_child_set;

          		reshade::log::message(
          			reshade::log::level::info,
          			"D3DMetal RTX semantic isolator v17.1: "
          			"CANDIDATE call=%llu target=%u consumed=%u "
          			"strategy=%u name=%s flags_index=%u "
          			"flags=0x%X children=%u total_children=%u "
          			"mode=%s.",
          			static_cast<unsigned long long>(call_id),
          			v171_semantic_target ? 1u : 0u,
          			s_v171_semantic_target_consumed ? 1u : 0u,
          			strategy_index,
          			parent_minimizer_strategies[
          				strategy_index].name,
          			flags_index,
          			parent_seed_flag_variants[flags_index],
          			v171_child_count,
          			static_cast<unsigned int>(
          				selected_children.size()),
          			v171_full_child_set ? "FULL" : "SEED");

          		if (
          			!v171_semantic_target ||
          			s_v171_semantic_target_consumed)
          		{
          			retry_hr = E_ABORT;
          			return false;
          		}

          		s_v171_semantic_target_consumed = true;

          		reshade::log::message(
          			reshade::log::level::info,
          			"D3DMetal RTX semantic isolator v17.1: "
          			"TARGET call=%llu strategy=10 "
          			"name=full-minus-global-root "
          			"flags_index=0 flags=0x3 "
          			"children=%u mode=FULL.",
          			static_cast<unsigned long long>(call_id),
          			v171_child_count);
          """

          insert_position = init_position + len(init_anchor)

          text = (
              text[:insert_position] +
              gate +
              text[insert_position:]
          )

          call_anchor = (
              "\t\tretry_hr = s_original_create_state_object(\n"
              "\t\t\tdevice, &flat_desc, "
              "__uuidof(ID3D12StateObject), retry_object);\n"
              "\t\treturn SUCCEEDED(retry_hr) && "
              "retry_object != nullptr && "
              "*retry_object != nullptr;\n"
          )

          call_position = text.find(
              call_anchor,
              function_position
          )

          if call_position < 0:
              raise RuntimeError(
                  "v17.1 CreateStateObject call anchor was not found"
              )

          call_replacement = r"""		if (
          			snapshot.pSubobjects == nullptr ||
          			snapshot.NumSubobjects == 0 ||
          			flat_desc.pSubobjects == nullptr ||
          			flat_desc.NumSubobjects == 0)
          		{
          			reshade::log::message(
          				reshade::log::level::warning,
          				"D3DMetal RTX canonical global-root rewriter v18: "
          				"ABORT call=%llu reason=null-or-empty-descriptor.",
          				static_cast<unsigned long long>(call_id));
          
          			retry_hr = E_INVALIDARG;
          			return false;
          		}
          
          		const D3D12_STATE_SUBOBJECT *v18_parent_global = nullptr;
          		unsigned int v18_parent_global_count = 0;
          
          		for (
          			UINT v18_i = 0;
          			v18_i < snapshot.NumSubobjects;
          			++v18_i)
          		{
          			if (
          				snapshot.pSubobjects[v18_i].Type ==
          				D3D12_STATE_SUBOBJECT_TYPE_GLOBAL_ROOT_SIGNATURE)
          			{
          				v18_parent_global =
          					&snapshot.pSubobjects[v18_i];
          
          				++v18_parent_global_count;
          			}
          		}
          
          		unsigned int v18_flat_global_count = 0;
          		unsigned int v18_association_count = 0;
          
          		for (
          			UINT v18_i = 0;
          			v18_i < flat_desc.NumSubobjects;
          			++v18_i)
          		{
          			if (
          				flat_desc.pSubobjects[v18_i].Type ==
          				D3D12_STATE_SUBOBJECT_TYPE_GLOBAL_ROOT_SIGNATURE)
          			{
          				++v18_flat_global_count;
          			}
          			else if (
          				flat_desc.pSubobjects[v18_i].Type ==
          				D3D12_STATE_SUBOBJECT_TYPE_SUBOBJECT_TO_EXPORTS_ASSOCIATION)
          			{
          				++v18_association_count;
          			}
          		}
          
          		reshade::log::message(
          			reshade::log::level::info,
          			"D3DMetal RTX canonical global-root rewriter v18: "
          			"BEGIN call=%llu parent_globals=%u flat_globals=%u "
          			"associations=%u input_subobjects=%u.",
          			static_cast<unsigned long long>(call_id),
          			v18_parent_global_count,
          			v18_flat_global_count,
          			v18_association_count,
          			flat_desc.NumSubobjects);
          
          		if (
          			v18_parent_global_count != 1 ||
          			v18_parent_global == nullptr)
          		{
          			reshade::log::message(
          				reshade::log::level::warning,
          				"D3DMetal RTX canonical global-root rewriter v18: "
          				"ABORT call=%llu reason=parent-global-count "
          				"count=%u.",
          				static_cast<unsigned long long>(call_id),
          				v18_parent_global_count);
          
          			retry_hr = E_INVALIDARG;
          			return false;
          		}
          
          		std::vector<D3D12_STATE_SUBOBJECT> v18_subobjects;
          		std::vector<D3D12_SUBOBJECT_TO_EXPORTS_ASSOCIATION>
          			v18_associations;
          		std::vector<int> v18_old_to_new(
          			flat_desc.NumSubobjects,
          			-1);
          
          		v18_subobjects.reserve(
          			static_cast<size_t>(flat_desc.NumSubobjects) + 1);
          
          		v18_associations.reserve(v18_association_count);
          
          		// The original parent root is the only global root in V18.
          		v18_subobjects.push_back(*v18_parent_global);
          
          		// Copy every non-global, non-association subobject first.
          		for (
          			UINT v18_i = 0;
          			v18_i < flat_desc.NumSubobjects;
          			++v18_i)
          		{
          			const D3D12_STATE_SUBOBJECT &v18_source =
          				flat_desc.pSubobjects[v18_i];
          
          			if (
          				v18_source.Type ==
          				D3D12_STATE_SUBOBJECT_TYPE_GLOBAL_ROOT_SIGNATURE ||
          				v18_source.Type ==
          				D3D12_STATE_SUBOBJECT_TYPE_SUBOBJECT_TO_EXPORTS_ASSOCIATION)
          			{
          				continue;
          			}
          
          			v18_old_to_new[v18_i] =
          				static_cast<int>(v18_subobjects.size());
          
          			v18_subobjects.push_back(v18_source);
          		}
          
          		const uintptr_t v18_flat_begin =
          			reinterpret_cast<uintptr_t>(
          				flat_desc.pSubobjects);
          
          		const uintptr_t v18_flat_span =
          			static_cast<uintptr_t>(
          				flat_desc.NumSubobjects) *
          			sizeof(D3D12_STATE_SUBOBJECT);
          
          		const uintptr_t v18_flat_end =
          			v18_flat_begin + v18_flat_span;
          
          		// Recreate every association after all target subobjects have
          		// stable addresses in the new descriptor.
          		for (
          			UINT v18_i = 0;
          			v18_i < flat_desc.NumSubobjects;
          			++v18_i)
          		{
          			const D3D12_STATE_SUBOBJECT &v18_source =
          				flat_desc.pSubobjects[v18_i];
          
          			if (
          				v18_source.Type !=
          				D3D12_STATE_SUBOBJECT_TYPE_SUBOBJECT_TO_EXPORTS_ASSOCIATION)
          			{
          				continue;
          			}
          
          			const auto *v18_old_association =
          				static_cast<
          					const D3D12_SUBOBJECT_TO_EXPORTS_ASSOCIATION *>(
          						v18_source.pDesc);
          
          			if (
          				v18_old_association == nullptr ||
          				v18_old_association->pSubobjectToAssociate == nullptr)
          			{
          				reshade::log::message(
          					reshade::log::level::warning,
          					"D3DMetal RTX canonical global-root rewriter v18: "
          					"ABORT call=%llu reason=null-association sub=%u.",
          					static_cast<unsigned long long>(call_id),
          					v18_i);
          
          				retry_hr = E_INVALIDARG;
          				return false;
          			}
          
          			const uintptr_t v18_target_address =
          				reinterpret_cast<uintptr_t>(
          					v18_old_association->
          						pSubobjectToAssociate);
          
          			if (
          				v18_target_address < v18_flat_begin ||
          				v18_target_address >= v18_flat_end ||
          				(
          					(v18_target_address - v18_flat_begin) %
          					sizeof(D3D12_STATE_SUBOBJECT)
          				) != 0)
          			{
          				reshade::log::message(
          					reshade::log::level::warning,
          					"D3DMetal RTX canonical global-root rewriter v18: "
          					"ABORT call=%llu "
          					"reason=association-target-outside-flat-descriptor "
          					"sub=%u.",
          					static_cast<unsigned long long>(call_id),
          					v18_i);
          
          				retry_hr = E_INVALIDARG;
          				return false;
          			}
          
          			const UINT v18_old_target_index =
          				static_cast<UINT>(
          					(v18_target_address - v18_flat_begin) /
          					sizeof(D3D12_STATE_SUBOBJECT));
          
          			if (
          				flat_desc.pSubobjects[v18_old_target_index].Type ==
          				D3D12_STATE_SUBOBJECT_TYPE_GLOBAL_ROOT_SIGNATURE)
          			{
          				reshade::log::message(
          					reshade::log::level::warning,
          					"D3DMetal RTX canonical global-root rewriter v18: "
          					"ABORT call=%llu "
          					"reason=association-targeted-removed-global "
          					"sub=%u target=%u.",
          					static_cast<unsigned long long>(call_id),
          					v18_i,
          					v18_old_target_index);
          
          				retry_hr = E_INVALIDARG;
          				return false;
          			}
          
          			const int v18_new_target_index =
          				v18_old_to_new[v18_old_target_index];
          
          			if (v18_new_target_index < 0)
          			{
          				reshade::log::message(
          					reshade::log::level::warning,
          					"D3DMetal RTX canonical global-root rewriter v18: "
          					"ABORT call=%llu reason=unmapped-association-target "
          					"sub=%u target=%u.",
          					static_cast<unsigned long long>(call_id),
          					v18_i,
          					v18_old_target_index);
          
          				retry_hr = E_INVALIDARG;
          				return false;
          			}
          
          			v18_associations.push_back(*v18_old_association);
          
          			v18_associations.back().pSubobjectToAssociate =
          				&v18_subobjects[
          					static_cast<size_t>(
          						v18_new_target_index)];
          
          			D3D12_STATE_SUBOBJECT v18_new_association = {};
          			v18_new_association.Type =
          				D3D12_STATE_SUBOBJECT_TYPE_SUBOBJECT_TO_EXPORTS_ASSOCIATION;
          			v18_new_association.pDesc =
          				&v18_associations.back();
          
          			v18_subobjects.push_back(v18_new_association);
          		}
          
          		D3D12_STATE_OBJECT_DESC v18_desc = flat_desc;
          		v18_desc.NumSubobjects =
          			static_cast<UINT>(v18_subobjects.size());
          		v18_desc.pSubobjects = v18_subobjects.data();
          		reshade::log::message(
          			reshade::log::level::info,
          			"D3DMetal RTX original state-config restorer v19: "
          			"BEGIN call=%llu source_subobjects=%u output_subobjects=%u.",
          			static_cast<unsigned long long>(call_id),
          			snapshot.NumSubobjects,
          			v18_desc.NumSubobjects);

          		const D3D12_STATE_OBJECT_CONFIG *v19_parent_config = nullptr;
          		unsigned int v19_parent_config_count = 0;

          		for (
          			UINT v19_i = 0;
          			v19_i < snapshot.NumSubobjects;
          			++v19_i)
          		{
          			const D3D12_STATE_SUBOBJECT &v19_source =
          				snapshot.pSubobjects[v19_i];

          			if (
          				v19_source.Type !=
          					D3D12_STATE_SUBOBJECT_TYPE_STATE_OBJECT_CONFIG)
          			{
          				continue;
          			}

          			++v19_parent_config_count;

          			if (v19_source.pDesc == nullptr)
          			{
          				reshade::log::message(
          					reshade::log::level::warning,
          					"D3DMetal RTX original state-config restorer v19: "
          					"ABORT call=%llu reason=null-parent-config.",
          					static_cast<unsigned long long>(call_id));

          				retry_hr = E_INVALIDARG;
          				return false;
          			}

          			v19_parent_config =
          				static_cast<const D3D12_STATE_OBJECT_CONFIG *>(
          					v19_source.pDesc);
          		}

          		unsigned int v19_output_config_count = 0;
          		size_t v19_output_config_index = 0;

          		for (
          			size_t v19_i = 0;
          			v19_i < v18_subobjects.size();
          			++v19_i)
          		{
          			if (
          				v18_subobjects[v19_i].Type ==
          				D3D12_STATE_SUBOBJECT_TYPE_STATE_OBJECT_CONFIG)
          			{
          				v19_output_config_index = v19_i;
          				++v19_output_config_count;
          			}
          		}

          		if (
          			v19_parent_config_count != 1 ||
          			v19_parent_config == nullptr ||
          			v19_output_config_count != 1)
          		{
          			reshade::log::message(
          				reshade::log::level::warning,
          				"D3DMetal RTX original state-config restorer v19: "
          				"ABORT call=%llu reason=config-count "
          				"parent_configs=%u output_configs=%u.",
          				static_cast<unsigned long long>(call_id),
          				v19_parent_config_count,
          				v19_output_config_count);

          			retry_hr = E_INVALIDARG;
          			return false;
          		}

          		D3D12_STATE_OBJECT_CONFIG v19_state_config =
          			*v19_parent_config;

          		const unsigned int v19_original_flags =
          			static_cast<unsigned int>(v19_state_config.Flags);

          		if (v19_original_flags != 0x4u)
          		{
          			reshade::log::message(
          				reshade::log::level::warning,
          				"D3DMetal RTX original state-config restorer v19: "
          				"ABORT call=%llu reason=unexpected-parent-flags "
          				"flags=0x%X expected=0x4.",
          				static_cast<unsigned long long>(call_id),
          				v19_original_flags);

          			retry_hr = E_INVALIDARG;
          			return false;
          		}

          		v18_subobjects[v19_output_config_index].pDesc =
          			&v19_state_config;

          		v18_desc.pSubobjects = v18_subobjects.data();

          		reshade::log::message(
          			reshade::log::level::info,
          			"D3DMetal RTX original state-config restorer v19: "
          			"READY call=%llu parent_configs=%u output_configs=%u "
          			"restored_flags=0x%X subobjects=%u.",
          			static_cast<unsigned long long>(call_id),
          			v19_parent_config_count,
          			v19_output_config_count,
          			v19_original_flags,
          			v18_desc.NumSubobjects);
          
          		reshade::log::message(
          			reshade::log::level::info,
          			"D3DMetal RTX canonical global-root rewriter v18: "
          			"READY call=%llu input_subobjects=%u "
          			"output_subobjects=%u removed_globals=%u "
          			"canonical_parent_global=1 "
          			"remapped_associations=%u.",
          			static_cast<unsigned long long>(call_id),
          			flat_desc.NumSubobjects,
          			v18_desc.NumSubobjects,
          			v18_flat_global_count,
          			v18_association_count);
          
          		reshade::log::message(
          			reshade::log::level::info,
          			"D3DMetal RTX semantic isolator v17.1: "
          			"PRE CALL call=%llu strategy=10 "
          			"name=full-minus-global-root "
          			"flags_index=0 flags=0x3 "
          			"children=%u subobjects=%u mode=FULL.",
          			static_cast<unsigned long long>(call_id),
          			v171_child_count,
          			v18_desc.NumSubobjects);

          		retry_hr = s_original_create_state_object(
          			device,
          			&v18_desc,
          			__uuidof(ID3D12StateObject),
          			retry_object);

          		reshade::log::message(
          			FAILED(retry_hr) ?
          				reshade::log::level::warning :
          				reshade::log::level::info,
          			"D3DMetal RTX semantic isolator v17.1: "
          			"POST CALL call=%llu strategy=10 "
          			"name=full-minus-global-root "
          			"flags_index=0 flags=0x3 "
          			"children=%u subobjects=%u mode=FULL "
          			"hr=%s raw=0x%08X object=%p.",
          			static_cast<unsigned long long>(call_id),
          			v171_child_count,
          			v18_desc.NumSubobjects,
          			reshade::log::hr_to_string(
          				retry_hr).c_str(),
          			static_cast<uint32_t>(retry_hr),
          			retry_object != nullptr ?
          				*retry_object :
          				nullptr);

          		return
          			SUCCEEDED(retry_hr) &&
          			retry_object != nullptr &&
          			*retry_object != nullptr;
          """

          text = (
              text[:call_position] +
              call_replacement +
              text[call_position + len(call_anchor):]
          )

          required = [
              "D3DMetal RTX semantic isolator v17.1: ",
              "CANDIDATE call=%llu target=%u consumed=%u",
              "TARGET call=%llu strategy=10",
              "PRE CALL call=%llu strategy=10",
              "POST CALL call=%llu strategy=10",
              "name=full-minus-global-root",
              "D3DMetal RTX canonical global-root rewriter v18: ",
              "BEGIN call=%llu parent_globals=%u flat_globals=%u",
              "READY call=%llu input_subobjects=%u",
              "canonical_parent_global=1",
              "D3DMetal RTX original state-config restorer v19: ",
              "BEGIN call=%llu source_subobjects=%u output_subobjects=%u",
              "ABORT call=%llu reason=",
              "READY call=%llu parent_configs=%u output_configs=%u",
              "restored_flags=0x%X",
              "D3D12_STATE_SUBOBJECT_TYPE_STATE_OBJECT_CONFIG",
          ]

          for marker in required:
              if marker not in text:
                  raise RuntimeError(
                      f"missing v17.1 source fragment: {marker}"
                  )

          path.write_text(
              text,
              encoding="utf-8",
              newline="\n"
          )

          print(
              "SEMANTIC_FULL_STATE_ISOLATOR_"
              "V17_1_PATCH_OK"
          )
          '@

          Set-Content `
            -Path "$env:RUNNER_TEMP\patch_v17_1.py" `
            -Value $patch `
            -Encoding utf8

          python "$env:RUNNER_TEMP\patch_v17_1.py"

      - name: Patch physical DXIL bridge v24
        shell: pwsh
        run: |
          python "_v26_assets/.github/v26/patch_physical_dxil_bridge_v24.py"

      - name: Verify v24 source and descriptor harness
        shell: pwsh
        run: |
          $entry = Get-Content `
            "source\d3d12\d3d12.cpp" `
            -Raw

          $required = @(
            "D3DMetal RTX physical DXIL bridge v24: ",
            "MATCH call=%llu subobject=%llu ",
            "READY call=%llu replacement_bytes=%llu ",
            "POST call=%llu hr=%s raw=0x%08X object=%p.",
            "ACTIVE call=%llu; physically pruned ",
            "g_v24_original_parent_dxil",
            "g_v24_pruned_parent_dxil",
            "try_v24_physical_dxil_bridge(",
            "create_state_object_vtable_index = 62"
          )

          foreach ($marker in $required) {
            if (-not $entry.Contains($marker)) {
              throw "V24 source marker missing: $marker"
            }
          }

          $trace = $entry.IndexOf(
            "HRESULT STDMETHODCALLTYPE trace_create_state_object("
          )

          $gate = $entry.IndexOf(
            "if (try_v24_physical_dxil_bridge(",
            $trace
          )

          $legacy = $entry.IndexOf(
            "const HRESULT original_hr = s_original_create_state_object",
            $trace
          )

          if (-not (
            $trace -ge 0 -and
            $gate -gt $trace -and
            $legacy -gt $gate
          )) {
            throw "V24 exact replacement gate ordering is invalid."
          }

          $report = Get-Content `
            "v24-patch-report.txt" `
            -Raw

          if (-not $report.Contains(
            "V24_DESCRIPTOR_HARNESS_PASS"
          )) {
            throw "V24 descriptor harness failed."
          }

          Get-Content "v24-patch-report.txt"

