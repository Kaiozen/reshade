name: HSR RenoDX Compile-First Full HDR

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RENODX_REF: ee9ddee35e125e95e5fd242c1431b2a253cc9068

jobs:
  build:
    name: Full RenoDX HSR HDR, compile-first
    runs-on: windows-2022

    steps:
      - name: Checkout lab controls
        uses: actions/checkout@v4

      - name: Checkout pinned RenoDX
        uses: actions/checkout@v4
        with:
          repository: clshortfuse/renodx
          ref: ${{ env.RENODX_REF }}
          path: renodx
          submodules: recursive

      - name: Verify RenoDX pin
        shell: pwsh
        run: |
          $actual = (git -C renodx rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -ne $env:RENODX_REF.ToLowerInvariant()) {
            throw "Unexpected RenoDX commit: $actual"
          }
          "RENODX_PIN=PASS"

      - name: Apply full HSR shader/settings variant
        shell: pwsh
        run: |
          python .github\hsr-renodx\patch_hsr_variant.py `
            --file renodx\src\games\honkai-starrail\addon.cpp `
            --variant shader-only
          if ($LASTEXITCODE -ne 0) {
            throw "Base HSR shader-only variant patch failed."
          }

      - name: Flip only forced pipeline cloning OFF
        shell: pwsh
        run: |
          python .github\hsr-compile-first\patch_compile_first.py `
            renodx\src\games\honkai-starrail\addon.cpp
          if ($LASTEXITCODE -ne 0) {
            throw "Compile-first patch failed."
          }

          $source = Get-Content `
            renodx\src\games\honkai-starrail\addon.cpp `
            -Raw

          if ($source -notmatch "KAIOZEN_HSR_44_COMPILE_FIRST_FULL_HDR") {
            throw "Compile-first source marker missing."
          }
          if ($source -match "force_pipeline_cloning\s*=\s*true") {
            throw "Forced pipeline cloning is still enabled."
          }
          if ($source -notmatch "force_pipeline_cloning\s*=\s*false") {
            throw "Forced pipeline cloning OFF marker missing."
          }

          "FULL_RENODX_HSR_HDR=YES"
          "ALL_5_HSR_SHADERS=YES"
          "FORCE_PIPELINE_CLONING=OFF"
          "W5_QUARANTINE=NOT_APPLIED"

      - name: Set up RenoDX shader tools
        shell: pwsh
        working-directory: renodx
        run: |
          .\scripts\setup-dev-env.ps1 -Update -Tools dxc,slang,glslang

      - name: Configure MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Configure RenoDX
        shell: pwsh
        working-directory: renodx
        run: cmake --preset vs-x64

      - name: Build HSR RenoDX
        shell: pwsh
        working-directory: renodx
        run: |
          cmake --build --preset vs-x64-release `
            --target honkai-starrail `
            --verbose

      - name: Package compile-first full-HDR addon
        shell: pwsh
        run: |
          $addon = Get-ChildItem renodx -Recurse -File `
            -Filter renodx-honkai-starrail.addon64 |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1

          if (-not $addon) {
            throw "RenoDX HSR addon was not produced."
          }

          New-Item -ItemType Directory -Force payload | Out-Null

          $out = "payload\renodx-hsr-compile-first.addon64"
          Copy-Item $addon.FullName $out -Force

          $bytes = [IO.File]::ReadAllBytes($out)
          $ascii = [Text.Encoding]::ASCII.GetString($bytes)

          if ($ascii -notmatch "KAIOZEN_HSR_44_COMPILE_FIRST_FULL_HDR") {
            throw "Compile-first binary marker missing."
          }
          if ($ascii -notmatch "W7_COMPILE_FIRST_FULL_HDR") {
            throw "Runtime W7 marker missing."
          }
          if ($ascii -match "W5_QUARANTINE_318A9DF6") {
            throw "W5 quarantine contamination detected."
          }

          $hash = (Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()

          @(
            "KAIOZEN_HSR_RENODX_LAB_PAYLOAD=1",
            "COMPONENT=renodx-hsr-compile-first.addon64",
            "VARIANT=compile-first-full-hdr",
            "SOURCE=clshortfuse/renodx",
            "COMMIT=$env:RENODX_REF",
            "FULL_RENODX_HSR_HDR=YES",
            "ALL_5_HSR_SHADERS=YES",
            "FORCE_PIPELINE_CLONING=OFF",
            "W5_QUARANTINE=OFF",
            "SHA256=$hash"
          ) | Set-Content payload\manifest.txt -Encoding ascii

          Get-Content payload\manifest.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hsr-renodx-compile-first-full-hdr
          path: payload
          if-no-files-found: error
          retention-days: 14
